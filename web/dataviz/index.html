<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Madrid · Match Center — Data Visualizations</title>

<!-- Clean geometric sans; falls back to the system stack if the font can't load.
     Two weights only (400 / 500) per the brand system. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================================
   BRAND SYSTEM  ·  Real Madrid Match Center — data-viz prototype
   Flat design: no gradients, no shadows, no glow. Hairline borders, whitespace.
   Every color also carries a size/position/label so color is never the only cue.
   ============================================================================ */
:root{
  /* --- club palette --- */
  --blue:      #0A2472;   /* primary club blue           */
  --gold:      #C8A24B;   /* gold accent                 */
  --gold-soft: #E0CFA0;   /* light gold / tan (away xG)  */

  /* home team = Argentina, standing in for "our team" (blue family) */
  --home:      #4A82D6;
  --home-soft: #7FA8E8;
  /* away team = Egypt (red family) */
  --away:      #D96B6B;
  --away-soft: #C94848;

  /* --- neutral surfaces (light) --- */
  --page:      #E6EAF3;
  --surface:   #EEF1F8;
  --surface-2: #FFFFFF;
  --border:    #D3D1C7;
  --ink:       #1A1A26;
  --muted:     #5A5A6E;

  --hair: 0.5px;                       /* hairline border weight */
  --radius: 14px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

/* --- dark mode: keep the club-blue identity, invert surfaces --- */
@media (prefers-color-scheme: dark){
  :root{
    --page:      #070B18;
    --surface:   #0E1327;
    --surface-2: #141A30;
    --border:    #2A3252;
    --ink:       #EAECF4;
    --muted:     #9AA0B8;
    --home-soft: #7FA8E8;
    --away-soft: #E08A8A;
  }
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--page);
  color:var(--ink);
  font-family:var(--font);
  font-weight:400;
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* Center the mobile column, cap width on desktop */
.wrap{
  max-width:480px;
  margin:0 auto;
  padding:0 0 48px;
  background:var(--page);
}

/* ---------------------------------------------------------------- header --- */
.appbar{
  position:sticky; top:0; z-index:50;
  background:var(--surface-2);
  border-bottom:var(--hair) solid var(--border);
  padding:10px 16px;
}
.appbar-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.score{
  font-weight:500; font-size:16px; letter-spacing:-0.01em;
  display:flex; align-items:center; gap:8px; white-space:nowrap;
}
.score .num{ color:var(--blue); }
@media (prefers-color-scheme: dark){ .score .num{ color:var(--home-soft); } }
.comp{ color:var(--muted); font-size:11px; margin-top:2px; }

/* Live toggle (tiny switch) */
.live{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); cursor:pointer; user-select:none; }
.live input{ position:absolute; opacity:0; width:0; height:0; }
.switch{
  width:34px; height:20px; border-radius:20px;
  background:var(--border); position:relative; transition:background .18s ease; flex:0 0 auto;
}
.switch::after{
  content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
  background:var(--surface-2); transition:transform .18s ease;
}
.live input:checked + .switch{ background:var(--home); }
.live input:checked + .switch::after{ transform:translateX(14px); }
.live-dot{ width:6px; height:6px; border-radius:50%; background:var(--away-soft); opacity:0; transition:opacity .2s; }
body.is-live .live-dot{ opacity:1; animation:blink 1.1s steps(2,start) infinite; }
@keyframes blink{ 50%{ opacity:.25; } }

/* ----------------------------------------------------------------- cards --- */
.intro{ padding:16px 16px 4px; color:var(--muted); font-size:12.5px; }
.card{
  background:var(--surface-2);
  border:var(--hair) solid var(--border);
  border-radius:var(--radius);
  margin:14px 16px;
  padding:16px 14px 12px;
}
.card h2{
  font-size:14px; font-weight:500; margin:0; letter-spacing:-0.01em;
  display:flex; align-items:baseline; gap:8px;
}
.card h2 .idx{ color:var(--gold); font-weight:500; font-size:12px; }
.card .sub{ color:var(--muted); font-size:11.5px; margin:4px 0 12px; }
.card svg.viz{ display:block; width:100%; height:auto; }

/* raw-data disclosure */
details.raw{ margin-top:10px; border-top:var(--hair) solid var(--border); padding-top:8px; }
details.raw summary{
  cursor:pointer; font-size:11px; color:var(--muted); list-style:none; display:flex; align-items:center; gap:6px;
}
details.raw summary::-webkit-details-marker{ display:none; }
details.raw summary::before{ content:"▸"; font-size:9px; transition:transform .15s; }
details.raw[open] summary::before{ transform:rotate(90deg); }
details.raw table{ width:100%; border-collapse:collapse; margin-top:8px; font-size:11px; }
details.raw th, details.raw td{ text-align:left; padding:3px 6px; border-bottom:var(--hair) solid var(--border); }
details.raw th{ color:var(--muted); font-weight:500; }
details.raw td.n{ text-align:right; font-variant-numeric:tabular-nums; }

.legend{ display:flex; flex-wrap:wrap; gap:10px 14px; font-size:10.5px; color:var(--muted); margin-top:8px; }
.legend .k{ display:inline-flex; align-items:center; gap:5px; }
.dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
.foot{ text-align:center; color:var(--muted); font-size:11px; padding:8px 16px 0; }

/* svg text defaults */
text{ font-family:var(--font); }
</style>
</head>
<body>
<div class="wrap">

  <!-- ═══════════════════════════ STICKY HEADER ═══════════════════════════ -->
  <header class="appbar">
    <div class="appbar-row">
      <div>
        <div class="score">
          🇦🇷 Argentina <span class="num">3</span> – <span class="num">2</span> Egipto 🇪🇬
        </div>
        <div class="comp">Copa del Mundo – Octavos de final</div>
      </div>
      <label class="live" title="Simula el partido en directo">
        <span class="live-dot"></span>
        <input type="checkbox" id="liveToggle">
        <span class="switch"></span>
        Live
      </label>
    </div>
  </header>

  <p class="intro">
    Prototipo de diseño · 8 formas nuevas de leer un partido. El significado <em>es</em> el dato:
    cada colina es un remate, cada destello un gol, cada inclinación el dominio real.
  </p>

  <!-- The 8 cards are generated by JS so the raw-data tables stay in sync with the data. -->
  <main id="feed"></main>

  <p class="foot">Prototipo — datos de muestra. Real Madrid · Match Center.</p>
</div>

<script>
/* ============================================================================
   SAMPLE DATA — match Argentina 3–2 Egypt. Exact values from the brief.
   (This is a design prototype: nothing here is wired to a live feed.)
   ============================================================================ */
const MATCH = {
  home: { name: "Argentina", short: "ARG", color: "#4A82D6" },
  away: { name: "Egipto",    short: "EGY", color: "#D96B6B" },
  score: [3, 2],
  competition: "Copa del Mundo – Octavos de final",
  possession: [64, 36],
  shots: [19, 5],
  onTarget: [7, 2],
  boxTouches: [34, 8],
  xg: [2.84, 0.89],
  prediction: { home: 57, draw: 18, away: 25, totalVotes: 710414 },
  goals: [
    { min: 15, team: "away", xg: 0.34, scorer: "Yasser Ibrahim" },
    { min: 67, team: "away", xg: 0.12, scorer: "Mostafa Ziko" },
    { min: 79, team: "home", xg: 0.28, scorer: "Cristian Romero" },
    { min: 83, team: "home", xg: 0.55, scorer: "Lionel Messi" },
    { min: 92, team: "home", xg: 0.41, scorer: "Enzo Fernández" }
  ],
  shotsData: [
    { min: 8,  team: "home", xg: 0.06, onTarget: false, goal: false },
    { min: 15, team: "away", xg: 0.34, onTarget: true,  goal: true  },
    { min: 21, team: "home", xg: 0.76, onTarget: true,  goal: false }, // Messi missed penalty
    { min: 33, team: "home", xg: 0.10, onTarget: false, goal: false },
    { min: 44, team: "home", xg: 0.14, onTarget: true,  goal: false },
    { min: 58, team: "home", xg: 0.09, onTarget: false, goal: false },
    { min: 67, team: "away", xg: 0.12, onTarget: true,  goal: true  },
    { min: 71, team: "home", xg: 0.22, onTarget: true,  goal: false },
    { min: 79, team: "home", xg: 0.28, onTarget: true,  goal: true  },
    { min: 83, team: "home", xg: 0.55, onTarget: true,  goal: true  },
    { min: 88, team: "away", xg: 0.18, onTarget: false, goal: false },
    { min: 92, team: "home", xg: 0.41, onTarget: true,  goal: true  }
  ],
  lineup: [
    { name: "Messi",      rating: 8.7, x: 0.82, y: 0.30, motm: true },
    { name: "Fernández",  rating: 8.2, x: 0.62, y: 0.42 },
    { name: "Paredes",    rating: 8.2, x: 0.30, y: 0.45 },
    { name: "Martínez",   rating: 7.6, x: 0.55, y: 0.22 },
    { name: "De Paul",    rating: 7.5, x: 0.42, y: 0.30 },
    { name: "Otamendi",   rating: 7.4, x: 0.40, y: 0.72 },
    { name: "Molina",     rating: 7.2, x: 0.78, y: 0.70 },
    { name: "Tagliafico", rating: 7.1, x: 0.20, y: 0.70 },
    { name: "Romero",     rating: 7.3, x: 0.58, y: 0.72 },
    { name: "Montiel",    rating: 7.0, x: 0.72, y: 0.55 },
    { name: "Martínez E", rating: 6.9, x: 0.50, y: 0.90 }
  ]
};

/* Full-match end minute (incl. stoppage). 90+2' goal lives at 92. */
const T_END = 95;

/* ============================================================================
   TINY HELPERS
   ============================================================================ */
const SVGNS = "http://www.w3.org/2000/svg";
/** create an SVG element with attributes */
function el(tag, attrs = {}, kids = []){
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  (Array.isArray(kids) ? kids : [kids]).forEach(c => c && n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
  return n;
}
/** deterministic PRNG (mulberry32) so stippling / scatter is stable across renders */
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
/** goal-minute label: 92 -> "90+2'" */
function minLabel(m){ return m>90 ? `90+${m-90}'` : `${m}'`; }
const fmtInt = n => n.toLocaleString('es-ES');
const es = n => String(n).replace('.', ','); // Spanish decimal comma

/** build a <details> raw-data block from rows [[label,value],...] or a full table */
function rawTable(cols, rows){
  const d = document.createElement('details'); d.className='raw';
  const s = document.createElement('summary'); s.textContent='Datos en crudo'; d.appendChild(s);
  const t = document.createElement('table');
  if (cols){
    const thead=document.createElement('thead'); const tr=document.createElement('tr');
    cols.forEach((c,i)=>{ const th=document.createElement('th'); th.textContent=c; if(i>0)th.style.textAlign='right'; tr.appendChild(th); });
    thead.appendChild(tr); t.appendChild(thead);
  }
  const tb=document.createElement('tbody');
  rows.forEach(r=>{ const tr=document.createElement('tr');
    r.forEach((cell,i)=>{ const td=document.createElement('td'); td.textContent=cell; if(i>0)td.className='n'; tr.appendChild(td); });
    tb.appendChild(tr);
  });
  t.appendChild(tb); d.appendChild(t); return d;
}

/** scaffold a card with title, subtitle, an SVG mount point, extras, and raw data */
function card(idx, title, subtitle){
  const c = document.createElement('section'); c.className='card';
  const h = document.createElement('h2');
  h.innerHTML = `<span class="idx">${idx}</span> ${title}`;
  const sub = document.createElement('div'); sub.className='sub'; sub.textContent = subtitle;
  c.appendChild(h); c.appendChild(sub);
  return c;
}
/* theme-aware ink for SVG text (resolved once at render) */
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

/* ============================================================================
   MOMENTUM MODEL — a per-minute momentum value in [-1,1].
   +1 = total home (ARG) dominance, -1 = total away (EGY) dominance.
   Control points are hand-authored to match the story of the events:
   ARG press early, EGY snatch a goal at 15', ARG win a pen (21') & surge late.
   The number IS the meaning: the frontier tilts by exactly this value.
   ============================================================================ */
const MOMENTUM = [
  [0,0.10],[6,0.35],[12,0.18],[15,-0.45],[18,-0.10],[21,0.55],[28,0.38],
  [38,0.30],[45,0.42],[52,0.28],[60,0.16],[67,-0.34],[70,0.18],[74,0.46],
  [79,0.62],[83,0.86],[88,0.58],[92,0.80],[95,0.90]
];
function momentumAt(m){
  if (m<=MOMENTUM[0][0]) return MOMENTUM[0][1];
  for (let i=1;i<MOMENTUM.length;i++){
    const [x1,y1]=MOMENTUM[i], [x0,y0]=MOMENTUM[i-1];
    if (m<=x1) return lerp(y0,y1,(m-x0)/(x1-x0));
  }
  return MOMENTUM[MOMENTUM.length-1][1];
}
/* Possession share (home %) over time — oscillates around the final 64%. */
function possHomeAt(m){ return clamp(58 + 6*Math.sin(m/13) + (m/95)*4, 30, 78); }

/* ============================================================================
   1 · MOMENTUM — "riverbed"  (HERO)
   A band over 90'. Central frontier tilts to the dominant team. Hills = shots
   (height ∝ xG). Goals = full-height flash + dashed line + label.
   `upto` clips the drawing for Live mode (progressive left→right reveal).
   ============================================================================ */
function vizMomentum(upto = T_END){
  /* ---- geometry ---- */
  const W=390, H=206, padL=14, padR=14, top=38, bot=150;   // banda de momentum
  const mid=(top+bot)/2, amp=48;
  const rugBase=180, rugH=24;                                // "regla" de xG de remates (abajo)
  const x = m => padL + (m/T_END)*(W-padL-padR);
  const fy = m => mid + momentumAt(m)*amp;                   // home + → frontera arriba (azul)

  const cHome=css('--home'), cAway=css('--away'), cInk=css('--ink'),
        cMuted=css('--muted'), cBorder=css('--border'), cGold=css('--gold');

  const svg = el('svg',{class:'viz', viewBox:`0 0 ${W} ${H}`, role:'img','aria-labelledby':'m1t m1d'});
  svg.appendChild(el('title',{id:'m1t'},'Momentum del partido'));
  svg.appendChild(el('desc',{id:'m1d'},
    'Banda de 90 minutos cuya frontera fluida se inclina hacia el equipo que domina cada minuto: arriba en azul manda Argentina, abajo en rojo Egipto. Debajo, una regla muestra el xG de cada remate, y los destellos verticales marcan los cinco goles.'));

  /* ---- frontera suave (Catmull-Rom → bézier, a mano; sin librería, offline) ---- */
  const pts=[]; for(let m=0;m<=upto;m+=1) pts.push([x(m),fy(m)]);
  if(pts.length<2) pts.push([x(0),fy(0)]);
  function smooth(P){
    if(P.length<3) return `M ${P[0][0].toFixed(2)} ${P[0][1].toFixed(2)} L ${P[P.length-1][0].toFixed(2)} ${P[P.length-1][1].toFixed(2)}`;
    let d=`M ${P[0][0].toFixed(2)} ${P[0][1].toFixed(2)}`;
    for(let i=0;i<P.length-1;i++){
      const p0=P[i-1]||P[i], p1=P[i], p2=P[i+1], p3=P[i+2]||P[i+1];
      const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
      const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
      d+=` C ${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${p2[0].toFixed(2)} ${p2[1].toFixed(2)}`;
    }
    return d;
  }
  const front=smooth(pts);
  const firstX=pts[0][0], lastX=pts[pts.length-1][0];

  /* ---- fills plenos: azul arriba (ARG), rojo abajo (EGY) ---- */
  svg.appendChild(el('path',{d:`${front} L ${lastX} ${top} L ${firstX} ${top} Z`, fill:cHome,'fill-opacity':0.34}));
  svg.appendChild(el('path',{d:`${front} L ${lastX} ${bot} L ${firstX} ${bot} Z`, fill:cAway,'fill-opacity':0.34}));
  svg.appendChild(el('line',{x1:padL,y1:mid,x2:W-padR,y2:mid,stroke:cMuted,'stroke-width':0.5,'stroke-dasharray':'1 4','stroke-opacity':0.4}));
  svg.appendChild(el('path',{d:front,fill:'none',stroke:cInk,'stroke-width':1.6,'stroke-opacity':0.55,'stroke-linecap':'round'}));
  svg.appendChild(el('rect',{x:padL,y:top,width:W-padL-padR,height:bot-top,rx:8,fill:'none',stroke:cBorder,'stroke-width':0.5}));

  /* ---- goles = destello vertical + punto en la frontera + etiqueta escalonada ---- */
  MATCH.goals.forEach((g,i)=>{
    if(g.min>upto) return;
    const cx=x(g.min), home=g.team==='home', col=home?cHome:cAway, short=home?MATCH.home.short:MATCH.away.short;
    svg.appendChild(el('line',{x1:cx,y1:top,x2:cx,y2:bot,stroke:col,'stroke-width':1,'stroke-dasharray':'2 3','stroke-opacity':0.55}));
    svg.appendChild(el('circle',{cx,cy:fy(g.min),r:3.4,fill:col,stroke:css('--surface-2'),'stroke-width':1.2}));
    const ly=11+(i%3)*11;
    const anchor = cx>W-64 ? 'end' : (cx<48?'start':'middle');
    svg.appendChild(el('line',{x1:cx,y1:ly+2,x2:cx,y2:top,stroke:col,'stroke-width':0.5,'stroke-opacity':0.35}));
    svg.appendChild(el('text',{x:cx,y:ly,'text-anchor':anchor,'font-size':8,fill:col,'font-weight':500},`${minLabel(g.min)} gol ${short}`));
  });

  /* ---- etiquetas de equipo + eje de minutos ---- */
  svg.appendChild(el('text',{x:padL+3,y:top+12,'font-size':9.5,'font-weight':500,fill:cHome},'Argentina'));
  svg.appendChild(el('text',{x:W-padR-3,y:bot-6,'text-anchor':'end','font-size':9.5,'font-weight':500,fill:cAway},'Egipto'));

  /* ---- REGLA de remates (abajo): una barra por remate, alto ∝ xG ---- */
  svg.appendChild(el('line',{x1:padL,y1:rugBase,x2:W-padR,y2:rugBase,stroke:cBorder,'stroke-width':0.5}));
  svg.appendChild(el('text',{x:padL,y:rugBase-rugH-3,'font-size':7,fill:cMuted},'xG de cada remate'));
  MATCH.shotsData.forEach(s=>{
    if(s.min>upto) return;
    const cx=x(s.min), h=(clamp(s.xg,0,0.8)/0.8)*rugH, col=s.team==='home'?cHome:cAway;
    svg.appendChild(el('rect',{x:cx-1.6,y:rugBase-h,width:3.2,height:h,rx:1.4,
      fill:col,'fill-opacity':s.onTarget?0.85:0.32}));
    if(s.goal) svg.appendChild(el('circle',{cx,cy:rugBase-h-3,r:1.8,fill:cGold}));   // punto dorado = gol
  });
  [0,15,30,45,60,75,90].forEach(m=>svg.appendChild(el('text',{x:x(m),y:H-3,'text-anchor':'middle','font-size':7,fill:cMuted},`${m}'`)));

  if(upto<T_END) svg.appendChild(el('line',{x1:x(upto),y1:top,x2:x(upto),y2:rugBase,stroke:cGold,'stroke-width':1}));
  return svg;
}

/* ============================================================================
   2 · xG ACUMULADO — "staircase"
   Each shot raises a step ∝ its xG. One line per team. Ends at the official
   totals (2.84 / 0.89) — the representative shot list is a subset, so a final
   riser closes the gap to the true total, direct-labelled at the right end.
   ============================================================================ */
function vizStaircase(){
  // ---- frame & scales -------------------------------------------------------
  const W=390, H=248, padL=28, padR=56, top=34, bot=196, xgMax=3.0;
  const plotW=W-padL-padR;
  const x=m=>padL+(m/T_END)*plotW;
  const y=v=>bot-(clamp(v,0,xgMax)/xgMax)*(bot-top);
  // brand system: ARG = azul (nuestro), EGY = rojo. Oro = SOLO acento de xG.
  const homeC=css('--home'), homeS=css('--home-soft');
  const awayC=css('--away'), awayS=css('--away-soft');
  const gold=css('--gold');
  const muted=css('--muted'), border=css('--border'), ink=css('--ink'), surf=css('--surface-2');

  const svg=el('svg',{class:'viz',viewBox:`0 0 ${W} ${H}`,role:'img','aria-labelledby':'m2t m2d'});
  svg.appendChild(el('title',{id:'m2t'},'xG acumulado por equipo'));
  svg.appendChild(el('desc',{id:'m2d'},
    'Gráfico de escalones monótono: cada remate sube un peldaño proporcional a su xG. '+
    'Argentina en azul sube hasta 2,84, con su área tramada de puntos como pista no cromática; '+
    'Egipto en rojo sube hasta 0,89. Los anillos son goles y el glifo de prohibido del minuto 21 '+
    'marca el penalti fallado, el mayor pico que no acabó en gol.'));

  // ---- defs: dot texture = pista NO cromática del área de ARG ----------------
  const defs=el('defs');
  const pat=el('pattern',{id:'stairDots',width:6,height:6,patternUnits:'userSpaceOnUse'});
  pat.appendChild(el('circle',{cx:1.3,cy:1.3,r:0.65,fill:homeC,'fill-opacity':0.30}));
  defs.appendChild(pat);
  svg.appendChild(defs);

  // ---- xG grid: medios en gris fino, enteros como acento de oro sutil -------
  [0,0.5,1,1.5,2,2.5,3].forEach(v=>{
    const major=Number.isInteger(v);
    svg.appendChild(el('line',{x1:padL,y1:y(v),x2:W-padR,y2:y(v),
      stroke:major?gold:border,'stroke-width':0.5,
      'stroke-opacity':major?(v===0?0.55:0.32):0.4}));
    if(major) svg.appendChild(el('text',{x:padL-6,y:y(v)+3,'text-anchor':'end','font-size':8,
      fill:muted,'font-variant-numeric':'tabular-nums'}, String(v)));
  });
  svg.appendChild(el('text',{x:padL-6,y:top-8,'text-anchor':'end','font-size':7.5,'font-weight':500,fill:gold},'xG'));

  // ---- half-time guide ------------------------------------------------------
  svg.appendChild(el('line',{x1:x(45),y1:top,x2:x(45),y2:bot,stroke:muted,
    'stroke-width':0.5,'stroke-opacity':0.3,'stroke-dasharray':'2 3'}));
  svg.appendChild(el('text',{x:x(45),y:top-3,'text-anchor':'middle','font-size':7,
    fill:muted,'fill-opacity':0.8},'descanso'));

  // ---- geometry per team ----------------------------------------------------
  function geom(team,total){
    const shots=MATCH.shotsData.filter(s=>s.team===team).sort((a,b)=>a.min-b.min);
    let cum=0, d=`M ${x(0)} ${y(0)}`; const pts=[];
    shots.forEach(s=>{ d+=` L ${x(s.min)} ${y(cum)}`; cum+=s.xg; d+=` L ${x(s.min)} ${y(cum)}`;
      pts.push({min:s.min,cum,shot:s}); });
    const lastMin=shots.length?shots[shots.length-1].min:0;
    const gap = total>cum+1e-6;
    // dashed riser closes the sample to the official total AT the last plotted
    // minute, so the trace stays monotonic in x and never backtracks.
    const dash = gap ? `M ${x(lastMin)} ${y(cum)} L ${x(lastMin)} ${y(total)} L ${x(T_END)} ${y(total)}` : null;
    const solid = gap ? d : d+` L ${x(T_END)} ${y(total)}`;
    const areaTop = d + (gap ? ` L ${x(lastMin)} ${y(total)} L ${x(T_END)} ${y(total)}` : ` L ${x(T_END)} ${y(total)}`);
    const area = areaTop+` L ${x(T_END)} ${y(0)} L ${x(0)} ${y(0)} Z`;
    return {pts,solid,dash,area};
  }
  const gA=geom('home',MATCH.xg[0]);
  const gE=geom('away',MATCH.xg[1]);

  // ---- areas (baja opacidad para dar cuerpo; EGY detrás, ARG tramado encima) -
  svg.appendChild(el('path',{d:gE.area,fill:awayC,'fill-opacity':0.11,stroke:'none'}));
  svg.appendChild(el('path',{d:gA.area,fill:homeC,'fill-opacity':0.07,stroke:'none'}));
  svg.appendChild(el('path',{d:gA.area,fill:'url(#stairDots)',stroke:'none'}));

  // ---- step lines (solid = sampled shots, dashed = residual to official total)
  function line(g,color){
    if(g.dash) svg.appendChild(el('path',{d:g.dash,fill:'none',stroke:color,'stroke-width':2,
      'stroke-linejoin':'round','stroke-linecap':'round','stroke-dasharray':'1.5 3','stroke-opacity':0.9}));
    svg.appendChild(el('path',{d:g.solid,fill:'none',stroke:color,'stroke-width':2,
      'stroke-linejoin':'round','stroke-linecap':'round'}));
  }
  line(gE,awayC);
  line(gA,homeC);   // ARG drawn last → on top

  // ---- shot markers ---------------------------------------------------------
  // La FORMA codifica el desenlace (nunca solo el color):
  //   gol → punto lleno + doble anillo · a puerta → lleno · fuera → hueco
  //   penalti fallado → glifo de prohibido (aparte, con llamada en oro)
  let penalty=null;
  function marks(g,color){
    g.pts.forEach(pt=>{
      const s=pt.shot, cx=x(pt.min), cy=y(pt.cum);
      if(pt.min===21 && !s.goal){ penalty={cx,cy}; return; }
      if(s.goal){
        svg.appendChild(el('circle',{cx,cy,r:7.5,fill:'none',stroke:color,'stroke-width':1,'stroke-opacity':0.25}));
        svg.appendChild(el('circle',{cx,cy,r:4.6,fill:'none',stroke:color,'stroke-width':1}));
        svg.appendChild(el('circle',{cx,cy,r:2.4,fill:color}));
      } else if(s.onTarget){
        svg.appendChild(el('circle',{cx,cy,r:2.5,fill:color}));
      } else {
        svg.appendChild(el('circle',{cx,cy,r:2.3,fill:surf,stroke:color,'stroke-width':1}));
      }
    });
  }
  marks(gE,awayC);
  marks(gA,homeC);

  // ---- el penalti que no fue: la mayor ocasión del partido, sin gol ---------
  // Glifo en ORO: acento de xG (el pico), no color de equipo.
  if(penalty){
    const {cx,cy}=penalty;
    svg.appendChild(el('circle',{cx,cy,r:4.6,fill:surf,stroke:gold,'stroke-width':1.3}));
    svg.appendChild(el('line',{x1:cx-3.1,y1:cy+3.1,x2:cx+3.1,y2:cy-3.1,stroke:gold,'stroke-width':1.3}));
    svg.appendChild(el('line',{x1:cx,y1:cy-6,x2:cx,y2:cy-14,stroke:gold,'stroke-width':0.5,'stroke-opacity':0.7}));
    svg.appendChild(el('text',{x:cx,y:cy-24,'text-anchor':'middle','font-size':8,'font-weight':500,fill:gold},'penalti fallado, 21\''));
    svg.appendChild(el('text',{x:cx,y:cy-15.5,'text-anchor':'middle','font-size':7.5,fill:muted},'0,76 xG · el pico sin gol'));
  }

  // ---- direct end labels (color de equipo: ARG azul, EGY rojo) --------------
  const plotR=W-padR;
  function endLabel(total,color,short){
    const yy=y(total);
    svg.appendChild(el('circle',{cx:plotR+3,cy:yy,r:1.6,fill:color}));
    svg.appendChild(el('text',{x:plotR+7,y:yy-3,'font-size':8,'font-weight':500,fill:color},short));
    svg.appendChild(el('text',{x:plotR+7,y:yy+8,'font-size':12.5,'font-weight':500,fill:color,
      'font-variant-numeric':'tabular-nums'}, es(total.toFixed(2))));
  }
  endLabel(MATCH.xg[0],homeC,MATCH.home.short);
  endLabel(MATCH.xg[1],awayC,MATCH.away.short);

  // ---- minute axis ----------------------------------------------------------
  [0,15,30,45,60,75,90].forEach(m=>svg.appendChild(el('text',{x:x(m),y:212,'text-anchor':'middle',
    'font-size':7,fill:muted,'font-variant-numeric':'tabular-nums'},`${m}'`)));

  // ---- legend (formas neutras = pista no cromática) -------------------------
  const ly=233;
  const g1=14; svg.appendChild(el('circle',{cx:g1,cy:ly-2,r:4.4,fill:'none',stroke:ink,'stroke-width':1,'stroke-opacity':0.75}));
  svg.appendChild(el('circle',{cx:g1,cy:ly-2,r:2.2,fill:ink,'fill-opacity':0.75}));
  svg.appendChild(el('text',{x:g1+9,y:ly+1,'font-size':7.5,fill:muted},'gol'));
  const g2=54; svg.appendChild(el('circle',{cx:g2,cy:ly-2,r:2.4,fill:ink,'fill-opacity':0.75}));
  svg.appendChild(el('text',{x:g2+8,y:ly+1,'font-size':7.5,fill:muted},'remate a puerta'));
  const g3=150; svg.appendChild(el('circle',{cx:g3,cy:ly-2,r:2.3,fill:surf,stroke:ink,'stroke-width':1,'stroke-opacity':0.75}));
  svg.appendChild(el('text',{x:g3+8,y:ly+1,'font-size':7.5,fill:muted},'fuera'));
  const g4=196; svg.appendChild(el('circle',{cx:g4,cy:ly-2,r:4.2,fill:'none',stroke:gold,'stroke-width':1.1}));
  svg.appendChild(el('line',{x1:g4-2.8,y1:ly+0.8,x2:g4+2.8,y2:ly-4.8,stroke:gold,'stroke-width':1.1}));
  svg.appendChild(el('text',{x:g4+8,y:ly+1,'font-size':7.5,fill:muted},'penalti fallado'));
  const g5=282; svg.appendChild(el('line',{x1:g5,y1:ly-2,x2:g5+12,y2:ly-2,stroke:ink,'stroke-width':1.6,'stroke-dasharray':'1.5 3','stroke-opacity':0.75}));
  svg.appendChild(el('text',{x:g5+16,y:ly+1,'font-size':7.5,fill:muted},'resto'));

  return svg;
}

/* ============================================================================
   3 · POSESIÓN — "tug of war"
   One rope, one central knot. Knot fraction from the ARG (left) end = away% —
   so ARG's larger share pulls the knot toward ARG. `frac` overridable for Live.
   ============================================================================ */
function vizTug(frac){
  /* Posesión como CONTROL DEL CAMPO. El equipo con más balón ocupa más terreno,
     así que "más posesión = más área" (se corrige la paradoja del tira y afloja,
     donde el que ganaba tenía menos barra). `frac` = cuota de EGY (0..1) para Live. */
  const W=390,H=118,padL=16,padR=16,barY=52,barH=42;
  const L=padL,R=W-padR,len=R-L;
  const homePct = frac!=null ? Math.round((1-frac)*100) : MATCH.possession[0];
  const awayPct = 100-homePct;
  const cxL = L + len*(homePct/100);      // línea de control: ARG ocupa [L, cxL]
  const midX = L + len/2;                 // medio campo (50%)

  const cHome=css('--home'), cAway=css('--away'), cMuted=css('--muted'),
        cBorder=css('--border'), cSurf=css('--surface-2'), cInk=css('--ink'), cGold=css('--gold');

  const svg=el('svg',{class:'viz',viewBox:`0 0 ${W} ${H}`,role:'img','aria-labelledby':'m3t m3d'});
  svg.appendChild(el('title',{id:'m3t'},'Posesión como control del campo'));
  svg.appendChild(el('desc',{id:'m3d'},
    'El campo se reparte según la posesión: el equipo con más balón ocupa más terreno y empuja la línea de control hacia el campo rival. Argentina controla el 64% del terreno, Egipto el 36%.'));

  /* ---- rounded pitch strip, split into two territories via clip ---- */
  const clipId='possclip';
  const defs=el('defs');
  const cp=el('clipPath',{id:clipId}); cp.appendChild(el('rect',{x:L,y:barY,width:len,height:barH,rx:9})); defs.appendChild(cp);
  svg.appendChild(defs);
  const g=el('g',{'clip-path':`url(#${clipId})`});
  g.appendChild(el('rect',{x:L,y:barY,width:cxL-L,height:barH,fill:cHome,'fill-opacity':0.85}));       // territorio ARG
  g.appendChild(el('rect',{x:cxL,y:barY,width:R-cxL,height:barH,fill:cAway,'fill-opacity':0.85}));     // territorio EGY
  /* mini marcas de campo: medio campo + círculo central (referencia 50%) */
  g.appendChild(el('line',{x1:midX,y1:barY,x2:midX,y2:barY+barH,stroke:cSurf,'stroke-width':1,'stroke-dasharray':'3 3','stroke-opacity':0.8}));
  g.appendChild(el('circle',{cx:midX,cy:barY+barH/2,r:12,fill:'none',stroke:cSurf,'stroke-width':1,'stroke-opacity':0.7}));
  svg.appendChild(g);
  svg.appendChild(el('rect',{x:L,y:barY,width:len,height:barH,rx:9,fill:'none',stroke:cBorder,'stroke-width':0.5}));

  /* ---- control line + ball ---- */
  svg.appendChild(el('line',{x1:cxL,y1:barY-7,x2:cxL,y2:barY+barH+7,stroke:cInk,'stroke-width':1.5}));
  svg.appendChild(el('circle',{cx:cxL,cy:barY+barH/2,r:5.5,fill:cSurf,stroke:cInk,'stroke-width':1.5}));
  svg.appendChild(el('circle',{cx:cxL,cy:barY+barH/2,r:2,fill:cGold}));

  /* ---- team labels + big percentages at the ends ---- */
  svg.appendChild(el('text',{x:L,y:22,'font-size':10,'font-weight':500,fill:cHome},'Argentina'));
  svg.appendChild(el('text',{x:L,y:43,'font-size':21,'font-weight':500,fill:cHome},`${homePct}%`));
  svg.appendChild(el('text',{x:R,y:22,'text-anchor':'end','font-size':10,'font-weight':500,fill:cAway},'Egipto'));
  svg.appendChild(el('text',{x:R,y:43,'text-anchor':'end','font-size':21,'font-weight':500,fill:cAway},`${awayPct}%`));

  /* ---- "push past midfield" annotation: winner shoved the control line into rival half ---- */
  const push = homePct-50;                    // +14 → ARG empuja hacia la derecha
  const y=barY+barH+12;
  if(Math.abs(push)>=1){
    const dir = push>0, col = dir?cHome:cAway;
    // conector desde medio campo hasta la línea de control + etiqueta debajo
    svg.appendChild(el('line',{x1:midX,y1:y,x2:cxL,y2:y,stroke:col,'stroke-width':1.2}));
    svg.appendChild(el('circle',{cx:midX,cy:y,r:1.6,fill:col}));
    const dir2 = dir?1:-1;
    svg.appendChild(el('path',{d:`M ${cxL} ${y} l ${-dir2*3} -2 l 0 4 Z`,fill:col}));
    svg.appendChild(el('text',{x:(midX+cxL)/2,y:barY+barH+23,'text-anchor':'middle','font-size':8,'font-weight':500,fill:col},
      `${dir?'+':'−'}${Math.abs(push)} en campo rival`));
  }
  return svg;
}

/* ============================================================================
   4 · MAPA DE TIROS — "constellation"
   Half-pitch dark field. Each shot = a star; size ∝ xG, opacity ∝ on-target,
   goal = filled bright star + ring. Two colors for two teams.
   NOTE: shotsData carries no pitch coords, so positions are synthesized
   deterministically — higher xG sits nearer the goal (assumption, see report).
   ============================================================================ */
function vizConstellation(){
  /* Ranking de MEJORES OCASIONES por xG. Se lee como una clasificación: la
     ocasión más clara arriba. Ordenado (nada de dispersión), etiquetado con
     minuto + protagonista y desenlace. Barra ∝ xG, color por equipo. */
  const shots = MATCH.shotsData.slice().sort((a,b)=> b.xg-a.xg || a.min-b.min);
  const W=390, top=16, rowH=16.5, padR=44, labelW=120;
  const barX = labelW, barMax = W - padR - barX;
  const H = top + shots.length*rowH + 20;
  const xgMax=0.8;
  const bw = v => (clamp(v,0,xgMax)/xgMax)*barMax;

  const cHome=css('--home'), cAway=css('--away'), cMuted=css('--muted'),
        cBorder=css('--border'), cInk=css('--ink'), cGold=css('--gold');

  /* protagonista por remate: goleador si es gol, penalti de Messi, o el equipo */
  const scorerByMin={}; MATCH.goals.forEach(g=>scorerByMin[g.min]=g.scorer.split(' ').slice(-1)[0]);
  function who(s){
    if(scorerByMin[s.min]) return scorerByMin[s.min];
    if(s.xg===0.76) return 'Penalti · Messi';
    return s.team==='home'?'Argentina':'Egipto';
  }
  function outcome(s){ return s.goal?'gol':(s.onTarget?'a puerta':'fuera'); }

  const svg=el('svg',{class:'viz',viewBox:`0 0 ${W} ${H}`,role:'img','aria-labelledby':'m4t m4d'});
  svg.appendChild(el('title',{id:'m4t'},'Mejores ocasiones por xG'));
  svg.appendChild(el('desc',{id:'m4d'},
    'Clasificación de las ocasiones del partido ordenadas de mayor a menor xG. La barra es el xG; el color, el equipo; y el desenlace se marca como gol, a puerta o fuera. La ocasión más clara fue el penalti fallado de Messi (0,76).'));

  /* eje xG de referencia arriba */
  [0.2,0.4,0.6,0.8].forEach(v=>{
    svg.appendChild(el('line',{x1:barX+bw(v),y1:top-4,x2:barX+bw(v),y2:H-14,stroke:cBorder,'stroke-width':0.5,'stroke-opacity':0.5}));
    svg.appendChild(el('text',{x:barX+bw(v),y:H-4,'text-anchor':'middle','font-size':7,fill:cMuted},es(v.toFixed(1))));
  });
  svg.appendChild(el('text',{x:barX,y:H-4,'text-anchor':'middle','font-size':7,fill:cMuted},'0'));

  shots.forEach((s,i)=>{
    const y=top+i*rowH, cy=y+rowH/2, col=s.team==='home'?cHome:cAway;
    const w=bw(s.xg);
    // etiqueta izquierda: minuto + protagonista
    svg.appendChild(el('text',{x:8,y:cy+3,'font-size':8.5,'font-weight':500,fill:cMuted,style:'font-variant-numeric:tabular-nums'},minLabel(s.min)));
    svg.appendChild(el('text',{x:34,y:cy+3,'font-size':8.5,fill:cInk},who(s)));
    // barra: gol=llena, a puerta=llena media, fuera=contorno
    if(s.onTarget){
      svg.appendChild(el('rect',{x:barX,y:cy-4.5,width:Math.max(w,2),height:9,rx:2.5,fill:col,'fill-opacity':s.goal?0.95:0.55}));
    }else{
      svg.appendChild(el('rect',{x:barX,y:cy-4.5,width:Math.max(w,2),height:9,rx:2.5,fill:col,'fill-opacity':0.10,stroke:col,'stroke-width':1}));
    }
    // punto dorado = gol al inicio de la barra
    if(s.goal) svg.appendChild(el('circle',{cx:barX-6,cy,r:3,fill:cGold}));
    // valor xG al final de la barra
    svg.appendChild(el('text',{x:barX+w+5,y:cy+3,'font-size':8.5,'font-weight':500,fill:col,style:'font-variant-numeric:tabular-nums'},es(s.xg.toFixed(2))));
  });
  return svg;
}

/* ============================================================================
   5 · CARA A CARA — "mirror bars"  (ANCHOR)
   Central axis; each metric grows from the center to each side. Bars scaled by
   the row max so the asymmetry alone tells the story; numbers direct-labelled.
   xG row highlighted in gold.
   ============================================================================ */
function vizMirror(){
  /* ---- data rows (each scaled by its OWN max so asymmetry = dominance) ---- */
  const rows=[
    {label:'Posesión',            h:MATCH.possession[0], a:MATCH.possession[1], suf:'%'},
    {label:'Tiros',               h:MATCH.shots[0],      a:MATCH.shots[1]},
    {label:'A puerta',            h:MATCH.onTarget[0],   a:MATCH.onTarget[1]},
    {label:'Toques en área rival',h:MATCH.boxTouches[0], a:MATCH.boxTouches[1]},
    {label:'xG',                  h:MATCH.xg[0],         a:MATCH.xg[1], gold:true, dec:true},
  ];
  const hg=MATCH.goals.filter(g=>g.team==='home').length;
  const ag=MATCH.goals.filter(g=>g.team==='away').length;

  /* ---- geometry ---- */
  const W=390, padX=16, cx=W/2, gap=2;
  const headTop=10, sepY=44, y0=58, rowH=34;
  const H=y0+rows.length*rowH+14;
  const maxBar=(W/2)-padX-38;                 // leaves room for the value number past the tip

  /* ---- theme-aware tokens (resolved once) ---- */
  const muted=css('--muted'), border=css('--border');
  const homeC=css('--home')||MATCH.home.color, awayC=css('--away')||MATCH.away.color;
  const gold=css('--gold')||'#C8A24B';
  const tnum='font-variant-numeric:tabular-nums;letter-spacing:0.2px';

  const svg=el('svg',{class:'viz',viewBox:`0 0 ${W} ${H}`,role:'img','aria-labelledby':'m5t m5d'});
  svg.appendChild(el('title',{id:'m5t'},'Estadísticas cara a cara en barras espejo'));
  svg.appendChild(el('desc',{id:'m5d'},
    'Eje central; cada métrica crece hacia el lado de su equipo y se escala por su propio máximo. '+
    'Argentina domina posesión 64 a 36, tiros 19 a 5, a puerta 7 a 2, toques en el área 34 a 8 y xG 2,84 a 0,89, pese al 3 a 2 final.'));

  /* half-rounded bar: rounds only the OUTER corners (flat toward the axis) */
  function barPath(x0,w,y,h,dir){
    const r=Math.max(0,Math.min(3,w/2,h/2));
    if(dir>0){ const xe=x0+w; return `M${x0},${y} H${xe-r} Q${xe},${y} ${xe},${y+r} V${y+h-r} Q${xe},${y+h} ${xe-r},${y+h} H${x0} Z`; }
    const xe=x0-w; return `M${x0},${y} H${xe+r} Q${xe},${y} ${xe},${y+r} V${y+h-r} Q${xe},${y+h} ${xe+r},${y+h} H${x0} Z`;
  }

  /* ---- header: team swatches + names, final score anchored in the middle ---- */
  const sw=9, nameY=headTop+18;
  svg.appendChild(el('rect',{x:padX,y:headTop+6,width:sw,height:sw,rx:2,fill:homeC}));
  svg.appendChild(el('text',{x:padX+sw+6,y:nameY,'font-size':11,'font-weight':500,fill:homeC},MATCH.home.name));
  svg.appendChild(el('rect',{x:W-padX-sw,y:headTop+6,width:sw,height:sw,rx:2,fill:awayC}));
  svg.appendChild(el('text',{x:W-padX-sw-6,y:nameY,'text-anchor':'end','font-size':11,'font-weight':500,fill:awayC},MATCH.away.name));
  // final score — real datum, ties the two headers together
  svg.appendChild(el('text',{x:cx-9,y:nameY+1,'text-anchor':'end','font-size':15,'font-weight':500,fill:homeC,style:tnum},String(hg)));
  svg.appendChild(el('text',{x:cx,y:nameY+1,'text-anchor':'middle','font-size':12,fill:muted},'–'));
  svg.appendChild(el('text',{x:cx+9,y:nameY+1,'font-size':15,'font-weight':500,fill:awayC,style:tnum},String(ag)));
  svg.appendChild(el('line',{x1:padX,y1:sepY,x2:W-padX,y2:sepY,stroke:border,'stroke-width':0.5}));

  /* ---- rows ---- */
  rows.forEach((row,i)=>{
    const yc=y0+i*rowH+rowH/2;
    const max=Math.max(row.h,row.a)||1;
    const hw=(row.h/max)*maxBar, aw=(row.a/max)*maxBar;
    const barY=yc-7, barH=14;
    const homeLeads=row.h>=row.a;

    const hCol=row.gold?gold:homeC, aCol=row.gold?gold:awayC;

    // xG row: gold highlight band spanning the full width
    if(row.gold){
      svg.appendChild(el('rect',{x:padX-2,y:yc-16,width:W-2*padX+4,height:32,rx:7,
        fill:gold,'fill-opacity':0.08,stroke:gold,'stroke-opacity':0.35,'stroke-width':0.5}));
    }

    // faint full-extent tracks (aligned grid: shows the leader's full reach)
    const trkOp=row.gold?0.14:0.10;
    svg.appendChild(el('path',{d:barPath(cx-gap,maxBar,barY,barH,-1),fill:hCol,'fill-opacity':trkOp}));
    svg.appendChild(el('path',{d:barPath(cx+gap,maxBar,barY,barH,+1),fill:aCol,'fill-opacity':trkOp}));

    // bars — leader fuller, trailer lighter (opacity layering, not a shadow)
    svg.appendChild(el('path',{d:barPath(cx-gap,hw,barY,barH,-1),fill:hCol,'fill-opacity':homeLeads?0.92:0.6}));
    svg.appendChild(el('path',{d:barPath(cx+gap,aw,barY,barH,+1),fill:aCol,'fill-opacity':homeLeads?0.6:0.92}));

    // metric label centred above the axis
    svg.appendChild(el('text',{x:cx,y:yc-12,'text-anchor':'middle','font-size':9,
      'font-weight':row.gold?500:400,fill:row.gold?gold:muted},row.label));

    // value numbers at each bar tip — leader larger/heavier
    const hv=row.dec?es(row.h.toFixed(2)):row.h+(row.suf||'');
    const av=row.dec?es(row.a.toFixed(2)):row.a+(row.suf||'');
    svg.appendChild(el('text',{x:cx-gap-hw-5,y:yc+3.6,'text-anchor':'end',
      'font-size':homeLeads?13:11,'font-weight':homeLeads?500:400,
      fill:hCol,'fill-opacity':homeLeads?1:0.75,style:tnum},hv));
    svg.appendChild(el('text',{x:cx+gap+aw+5,y:yc+3.6,
      'font-size':homeLeads?11:13,'font-weight':homeLeads?400:500,
      fill:aCol,'fill-opacity':homeLeads?0.75:1,style:tnum},av));
  });

  // central axis
  svg.appendChild(el('line',{x1:cx,y1:sepY+4,x2:cx,y2:H-8,stroke:border,'stroke-width':0.5}));
  return svg;
}

/* ============================================================================
   6 · VALORACIONES + MOTM — "starfield"
   Club-blue pitch (halfway line + centre circle). Starting XI at formation
   coords; star size/brightness ∝ rating. MOTM = biggest, brightest star + ring + ★.
   Coord assumption: x=0..1 left→right, y=0 attack (top) → 1 own goal (bottom).
   Tap a star → console.log (stub for "open player detail").
   ============================================================================ */
function vizStarfield(){
  const W=390,H=310;
  // Field frame (dark, fixed) and player play-area (inset from the lines)
  const fx0=16,fx1=374,fy0=16,fy1=280,cxF=(fx0+fx1)/2,cyF=(fy0+fy1)/2;
  const px=v=>lerp(24,366,v);        // 0..1 left→right, inset from touchlines
  const py=v=>lerp(30,262,v);        // 0=attack/top .. 1=own goal/bottom
  // fixed dark-field palette (literal, as allowed for constellation/starfield fields)
  const NAVY='#0A2472', LINE='rgba(255,255,255,0.12)', LINE2='rgba(255,255,255,0.22)';
  const GOLD='#C8A24B', GOLDSOFT='#E0CFA0';
  const svg=el('svg',{class:'viz',viewBox:`0 0 ${W} ${H}`,role:'img','aria-labelledby':'m6t m6d'});
  svg.appendChild(el('title',{id:'m6t'},'Valoraciones del once inicial de Argentina sobre un campo estelar'));
  svg.appendChild(el('desc',{id:'m6d'},'Campo azul del Real Madrid con el once titular en su formación. Cada jugador es una estrella cuyo tamaño y brillo crecen con su nota, de 6,9 a 8,7. Messi, con nota 8,7, es la estrella mayor, con anillo dorado y una marca de mejor valorado.'));

  // ---- field ----------------------------------------------------------------
  svg.appendChild(el('rect',{x:0,y:0,width:W,height:H,rx:12,fill:NAVY}));
  const mk={fill:'none',stroke:LINE,'stroke-width':0.6};
  // boundary + halfway + centre
  svg.appendChild(el('rect',{x:fx0,y:fy0,width:fx1-fx0,height:fy1-fy0,rx:6,...mk}));
  svg.appendChild(el('line',{x1:fx0,y1:cyF,x2:fx1,y2:cyF,...mk}));
  svg.appendChild(el('circle',{cx:cxF,cy:cyF,r:34,...mk}));
  svg.appendChild(el('circle',{cx:cxF,cy:cyF,r:1.4,fill:LINE2}));
  // penalty boxes, goal areas, spots (top = attacking goal, bottom = own goal)
  boxAt(fy0, 1);   // top
  boxAt(fy1,-1);   // bottom
  function boxAt(gy,dir){
    const bh=44,gh=18, ey=gy+dir*bh, gey=gy+dir*gh, sy=gy+dir*30;
    svg.appendChild(el('rect',{x:cxF-75,y:Math.min(gy,ey),width:150,height:bh,...mk}));
    svg.appendChild(el('rect',{x:cxF-33,y:Math.min(gy,gey),width:66,height:gh,...mk}));
    svg.appendChild(el('circle',{cx:cxF,cy:sy,r:1.2,fill:LINE2}));
    // penalty arc outside the box
    const dy=Math.abs(ey-sy), dx=Math.sqrt(Math.max(0,30*30-dy*dy));
    const flag=dir>0?1:0;
    svg.appendChild(el('path',{d:`M ${(cxF-dx).toFixed(1)} ${ey} A 30 30 0 0 ${flag} ${(cxF+dx).toFixed(1)} ${ey}`,...mk}));
    // goal frame straddling the line
    svg.appendChild(el('rect',{x:cxF-16,y:dir>0?gy-4:gy,width:32,height:4,fill:'none',stroke:LINE2,'stroke-width':0.6}));
  }

  // ---- brightness / size ramp by rating -------------------------------------
  const ratings=MATCH.lineup.map(p=>p.rating);
  const rMin=Math.min(...ratings), rMax=Math.max(...ratings);   // 6,9 → 8,7
  const norm=r=>clamp((r-rMin)/(rMax-rMin),0,1);
  const mix=(t,a,b)=>`rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],t))).join(',')})`;
  const DIM=[110,134,196], BRIGHT=[236,242,255];
  function starPath(cx,cy,ro){
    const ri=ro*0.42; let d='';
    for(let i=0;i<10;i++){ const rr=i%2?ri:ro, a=Math.PI/5*i-Math.PI/2;
      d+=(i?'L':'M')+(cx+Math.cos(a)*rr).toFixed(2)+' '+(cy+Math.sin(a)*rr).toFixed(2)+' '; }
    return d+'Z';
  }

  // draw outfield first, MVP last so it sits on top
  const order=[...MATCH.lineup].sort((a,b)=>(a.motm?1:0)-(b.motm?1:0));
  order.forEach((p,i)=>{
    const x=px(p.x), y=py(p.y), t=norm(p.rating);
    const r=4.5+t*7.5;                          // 4,5 → 12 px
    const mvp=!!p.motm;
    const g=el('g',{class:'rm-player',style:'cursor:pointer'});
    g.addEventListener('click',()=>console.log('open player detail:',p.name,p.rating));

    // luminous halo (translucent layer — brightness IS the rating)
    const halo=el('circle',{cx:x,cy:y,r:r*2.0+2,
      fill:mvp?GOLD:'#FFFFFF','fill-opacity':mvp?0.20:(0.05+t*0.11),
      class:mvp?'rm-halo rm-mvp':'rm-halo',style:`animation-delay:${(i*0.31).toFixed(2)}s`});
    g.appendChild(halo);

    if(mvp){
      g.appendChild(el('circle',{cx:x,cy:y,r:r+7,fill:'none',stroke:GOLD,'stroke-width':1.3,'stroke-opacity':0.9}));
      g.appendChild(el('circle',{cx:x,cy:y,r:r+11,fill:'none',stroke:GOLD,'stroke-width':0.6,'stroke-opacity':0.35}));
    }
    // star + bright core
    g.appendChild(el('path',{d:starPath(x,y,r),fill:mvp?'#DCB65E':mix(t,DIM,BRIGHT),'fill-opacity':mvp?1:0.55+t*0.4}));
    g.appendChild(el('circle',{cx:x,cy:y,r:Math.max(1,r*0.34),fill:mvp?'#F3E7C2':'#FFFFFF','fill-opacity':0.85}));

    // ---- label: surname (dim) + rating (bright) -----------------------------
    // always below the star; the formation + inset play-area keep them clear
    const ly=y+r+11;
    const lx=clamp(x,30,W-30);
    const label=el('text',{x:lx,y:ly,'text-anchor':'middle','font-size':8.4,
      'font-family':'inherit','font-weight':mvp?500:400});
    label.appendChild(el('tspan',{fill:mvp?GOLDSOFT:'#B7C3E4',
      'font-weight':mvp?500:400}, (mvp?'★ ':'')+p.name+' '));
    label.appendChild(el('tspan',{fill:mvp?'#F2E6C0':'#F1F4FC','font-weight':500,
      style:'font-variant-numeric:tabular-nums'}, es(p.rating.toFixed(1))));
    g.appendChild(label);

    svg.appendChild(g);
  });

  // ---- in-field key (helps a first-time viewer) -----------------------------
  const ky=294;
  const key=el('g');
  [[20,3.2,0.12],[34,4.8,0.28],[50,6.6,0.55]].forEach(([kx,kr,ko])=>{
    key.appendChild(el('path',{d:starPath(kx,ky-1,kr),fill:'#E4EAF7','fill-opacity':0.35+ko}));
  });
  key.appendChild(el('text',{x:62,y:ky+2,'font-size':7.6,fill:'rgba(230,236,247,0.55)'},
    'menor → mayor valoración'));
  key.appendChild(el('text',{x:374,y:ky+2,'text-anchor':'end','font-size':7.6,fill:GOLDSOFT},
    '★ mejor valorado del partido'));
  svg.appendChild(key);

  return svg;
}

/* ============================================================================
   7 · TOQUES EN ÁREA RIVAL — "embers / heat"
   Two penalty boxes side by side. Touch count = density of stippled warm dots
   (+ soft warm blobs for the hot one). ARG 34 = glowing, EGY 8 = sparse.
   Not a raster blur — real dots, one cluster per count band.
   ============================================================================ */
function vizEmbers(){
  const W=390,H=250;
  const svg=el('svg',{class:'viz',viewBox:`0 0 ${W} ${H}`,role:'img','aria-labelledby':'m7t m7d'});
  svg.appendChild(el('title',{id:'m7t'},'Toques en el área rival, tipo brasas'));
  svg.appendChild(el('desc',{id:'m7d'},'Dos áreas de penalti enfrentadas vistas desde arriba. Cada brasa es un toque en el área rival y su color codifica la densidad local, del oro (toque aislado) al rojo (zona que arde). Argentina acumula 34 toques y arde frente a la portería; Egipto, solo 8, apenas deja rescoldos.'));

  // warm ramp: local touch density = temperature (oro -> ámbar -> brasa -> rojo)
  const RAMP=[[0,'#C8A24B'],[0.40,'#E39A3F'],[0.72,'#DE6A38'],[1,'#C94848']];
  function mix(a,b,t){
    const pa=[parseInt(a.slice(1,3),16),parseInt(a.slice(3,5),16),parseInt(a.slice(5,7),16)];
    const pb=[parseInt(b.slice(1,3),16),parseInt(b.slice(3,5),16),parseInt(b.slice(5,7),16)];
    return '#'+pa.map((v,i)=>clamp(Math.round(v+(pb[i]-v)*t),0,255).toString(16).padStart(2,'0')).join('');
  }
  function ramp(t){ t=clamp(t,0,1);
    for(let i=1;i<RAMP.length;i++){ if(t<=RAMP[i][0]){ const a=RAMP[i-1],b=RAMP[i]; return mix(a[1],b[1],(t-a[0])/(b[0]-a[0])); } }
    return RAMP[RAMP.length-1][1];
  }

  drawPanel(16,  MATCH.home, MATCH.boxTouches[0], 1337, true,  'zona que arde');
  drawPanel(204, MATCH.away, MATCH.boxTouches[1], 7,    false, 'apenas rescoldos');

  // leyenda de la rampa (enseña que el color es la densidad)
  const ly=240, dots=['#C8A24B','#E39A3F','#DE6A38','#C94848'];
  svg.appendChild(el('text',{x:W/2-33,y:ly+3.2,'text-anchor':'end','font-size':9,'font-weight':400,fill:css('--muted')},'frío'));
  dots.forEach((c,i)=> svg.appendChild(el('circle',{cx:W/2-19.5+i*13,cy:ly,r:3.4,fill:c})));
  svg.appendChild(el('text',{x:W/2+33,y:ly+3.2,'text-anchor':'start','font-size':9,'font-weight':400,fill:css('--muted')},'caliente'));

  return svg;

  function drawPanel(x0,team,count,seed,isHome,descr){
    const g=el('g');
    const panW=170,boxW=150,boxX=x0+(panW-boxW)/2,cx=x0+panW/2;
    const gy=48,boxD=112,boxB=gy+boxD;
    const heat=clamp(count/34,0,1);

    // lecho cálido tenue dentro del área (capa de opacidad plana)
    g.appendChild(el('rect',{x:boxX,y:gy,width:boxW,height:boxD,fill:'#E0663C','fill-opacity':(0.03+0.06*heat)}));

    // generar brasas: una por toque, agrupadas hacia la boca de portería
    const r=rng(seed);
    const hotX=cx,hotY=gy+20,maxR=58;
    const pts=[];
    for(let i=0;i<count;i++){
      const ang=r()*Math.PI*2, rad=Math.pow(r(),0.62)*maxR;
      const px=clamp(hotX+Math.cos(ang)*rad*1.02, boxX+7, boxX+boxW-7);
      const py=clamp(hotY+Math.sin(ang)*rad,       gy+4,   boxB-7);
      pts.push([px,py]);
    }
    // centroide -> "lecho de rescoldos" en capas translúcidas (opacidad, sin filtro)
    let mx=0,my=0; pts.forEach(p=>{mx+=p[0];my+=p[1];}); if(pts.length){mx/=pts.length;my/=pts.length;}
    for(let i=0;i<3;i++){
      g.appendChild(el('ellipse',{cx:mx,cy:my,rx:(30-i*7)*(0.55+0.55*heat),ry:(26-i*6)*(0.55+0.55*heat),
        fill:'#E0663C','fill-opacity':(0.05+0.07*heat)}));
    }

    // geometría del área (sobre el lecho, bajo las brasas)
    const mk={fill:'none',stroke:css('--border'),'stroke-width':0.8};
    const goalW=46,gx=cx-goalW/2;
    for(let i=0;i<=6;i++){ const xx=gx+i*(goalW/6); g.appendChild(el('line',{x1:xx,y1:gy-7,x2:xx,y2:gy,stroke:css('--border'),'stroke-width':0.5,'stroke-opacity':0.6})); }
    g.appendChild(el('line',{x1:gx,y1:gy-7,x2:gx+goalW,y2:gy-7,...mk}));
    g.appendChild(el('line',{x1:boxX,y1:gy,x2:boxX+boxW,y2:gy,fill:'none',stroke:css('--border'),'stroke-width':1.3}));
    g.appendChild(el('path',{d:`M${boxX} ${gy} V${boxB} H${boxX+boxW} V${gy}`,...mk}));
    const sixW=70,sixD=36,sixX=cx-sixW/2;
    g.appendChild(el('path',{d:`M${sixX} ${gy} V${gy+sixD} H${sixX+sixW} V${gy}`,...mk}));
    const spotY=gy+Math.round(boxD*12/18);
    g.appendChild(el('circle',{cx,cy:spotY,r:1.4,fill:css('--border')}));
    const arcR=Math.round(boxD*10/18), th0=Math.asin(clamp((boxB-spotY)/arcR,-1,1));
    let d='',N=26;
    for(let i=0;i<=N;i++){ const th=th0+(Math.PI-2*th0)*(i/N); d+=(i?'L':'M')+(cx+Math.cos(th)*arcR).toFixed(1)+' '+(spotY+Math.sin(th)*arcR).toFixed(1); }
    g.appendChild(el('path',{d,...mk}));

    // brasas encima: color = densidad local de toques
    pts.forEach(p=>{
      let n=0; pts.forEach(q=>{ const dx=p[0]-q[0],dy=p[1]-q[1]; if(dx*dx+dy*dy<225) n++; });
      const t=clamp((n-1)/7,0,1), col=ramp(t);
      if(t>0.14) g.appendChild(el('circle',{cx:p[0],cy:p[1],r:(4+4*t),fill:col,'fill-opacity':(0.10+0.10*t)}));
      g.appendChild(el('circle',{cx:p[0],cy:p[1],r:(2.1+1.7*t),fill:col,'fill-opacity':0.92}));
    });

    // etiquetas
    g.appendChild(el('rect',{x:boxX,y:19,width:9,height:9,rx:1.5,fill:team.color}));
    g.appendChild(el('text',{x:boxX+14,y:27,'font-size':11.5,'font-weight':500,fill:css('--ink')},team.name));

    const numCol=isHome?'#DE6A38':'#C8A24B';
    const tnum=el('text',{x:cx,y:212,'text-anchor':'middle',fill:numCol,style:'font-variant-numeric:tabular-nums'});
    tnum.appendChild(el('tspan',{'font-size':26,'font-weight':500},String(count)));
    tnum.appendChild(el('tspan',{'font-size':11,'font-weight':400,dx:5,fill:css('--muted')},'toques'));
    g.appendChild(tnum);
    g.appendChild(el('text',{x:cx,y:227,'text-anchor':'middle','font-size':10,'font-weight':400,fill:css('--muted')},descr));

    svg.appendChild(g);
  }
}

/* ============================================================================
   8 · PREDICCIÓN / ENCUESTA — "breathing bands"
   Three bands (ARG 57 / Empate 18 / EGY 25). Widths ∝ %. Bands "breathe"
   (CSS pulse) to convey live social volume. Live mode nudges the % + vote count.
   ============================================================================ */
let PRED = {...MATCH.prediction};
function vizBreathing(){
  const W=390, pad=18, barW=W-2*pad;
  const ink=css('--ink'), muted=css('--muted'), border=css('--border'), surf=css('--surface-2');
  const COL={home:css('--home'), draw:css('--gold'), away:css('--away')};

  // tres desenlaces en orden 1-X-2; el ancho ES el dato (% de votos)
  const bands=[
    {k:'home', label:`${MATCH.home.name} gana`, tint:'home'},
    {k:'draw', label:'Empate',                  tint:'draw'},
    {k:'away', label:`${MATCH.away.name} gana`,  tint:'away'},
  ];
  // desenlace favorito (dinámico: en Live sigue siendo correcto)
  const leadKey = bands.map(b=>b.k).reduce((a,b)=> PRED[b]>PRED[a]?b:a);

  // geometría
  const capY=13;                  // línea de la referencia de mayoría
  const row0=22, rowH=44, bh=13;  // bloque por banda
  const half=pad+barW*0.5;        // x del 50 % (mayoría absoluta)
  const barsTop=row0+16, barsBot=row0+rowH*2+bh;
  const H = barsBot + 46;

  const svg=el('svg',{class:'viz',viewBox:`0 0 ${W} ${H}`,role:'img','aria-labelledby':'m8t m8d',id:'breathSvg'});
  svg.appendChild(el('title',{id:'m8t'},'Predicción de la afición en bandas que respiran'));
  svg.appendChild(el('desc',{id:'m8d'},
    'Tres bandas de encuesta cuyo ancho es el porcentaje de votos —Argentina 57 %, empate 18 %, Egipto 25 %—; laten suavemente para transmitir el volumen social en directo sobre un total de 710.414 votos.'));

  const tnum='font-variant-numeric:tabular-nums';

  // ── referencia de mayoría absoluta (50 %) · capa de analista ──────────────
  svg.appendChild(el('line',{x1:half,y1:barsTop-2,x2:half,y2:barsBot+2,
    stroke:ink,'stroke-width':0.75,'stroke-dasharray':'1.5 3','stroke-opacity':0.28}));
  svg.appendChild(el('text',{x:half,y:capY,'text-anchor':'middle','font-size':8.5,
    'font-weight':400,fill:muted,style:tnum},'mayoría · 50 %'));

  // ── las tres bandas de encuesta ───────────────────────────────────────────
  bands.forEach((b,i)=>{
    const rowTop=row0+i*rowH;
    const labelY=rowTop+11;
    const barY=rowTop+16;
    const cy=barY+bh/2;
    const pct=PRED[b.k];
    const w=Math.max(bh, (pct/100)*barW);   // nunca más fino que el semicírculo del cap
    const col=COL[b.tint];
    const isLead=b.k===leadKey;

    // chip: redundancia de color independiente de la banda
    svg.appendChild(el('rect',{x:pad,y:labelY-8,width:8,height:8,rx:2,fill:col,'fill-opacity':0.95}));
    // etiqueta del desenlace
    svg.appendChild(el('text',{x:pad+13,y:labelY,'font-size':11,
      'font-weight':isLead?500:400,fill:ink},b.label));
    // marca de favorito en el desenlace líder
    if(isLead){
      svg.appendChild(el('text',{x:half-6,y:labelY,'text-anchor':'end','font-size':8.5,
        'font-weight':500,fill:col,'letter-spacing':0.2},'favorito ▸'));
    }
    // porcentaje grande alineado a la derecha (tamaño + posición + etiqueta; el color es secundario)
    svg.appendChild(el('text',{x:pad+barW,y:labelY+0.5,'text-anchor':'end',
      'font-size':isLead?15:13,'font-weight':500,fill:col,style:tnum},`${pct}%`));

    // pista fantasma: teñida con el propio color del desenlace (su cuota no reclamada)
    svg.appendChild(el('rect',{x:pad,y:barY,width:barW,height:bh,rx:bh/2,
      fill:col,'fill-opacity':0.10}));
    svg.appendChild(el('rect',{x:pad,y:barY,width:barW,height:bh,rx:bh/2,
      fill:'none',stroke:border,'stroke-width':0.5}));

    // banda rellena: respira desde su borde izquierdo anclado
    svg.appendChild(el('rect',{x:pad,y:barY,width:w,height:bh,rx:bh/2,
      fill:col,'fill-opacity':0.92,class:'breathe','data-k':b.k,
      style:`animation-delay:${(i*0.42).toFixed(2)}s;transform-origin:${pad}px ${cy}px`}));
  });

  // ── pie · contador de votos en directo con jerarquía ──────────────────────
  const fy=barsBot+30;
  svg.appendChild(el('line',{x1:pad,y1:barsBot+14,x2:W-pad,y2:barsBot+14,
    stroke:border,'stroke-width':0.5}));

  // latido "en directo" que respira
  svg.appendChild(el('circle',{cx:pad+4,cy:fy-4,r:3,fill:COL.draw,class:'breathe',
    style:`transform-origin:${pad+4}px ${fy-4}px`}));

  // votos: número en tinta (peso 500), unidad tenue; todo el grupo pulsa
  svg.appendChild(el('text',{x:pad+13,y:fy,'font-size':10.5,fill:muted,id:'voteCount',style:tnum},[
    el('tspan',{'font-size':13.5,'font-weight':500,fill:ink,style:tnum},fmtInt(PRED.totalVotes)),
    el('tspan',{fill:muted},'  votos'),
  ]));

  // margen del líder (puntos sobre el segundo) · lectura de analista
  const margin=PRED[leadKey]-Math.max(...bands.map(b=>b.k).filter(k=>k!==leadKey).map(k=>PRED[k]));
  const leadName=leadKey==='draw'?'Empate':(leadKey==='home'?MATCH.home.name:MATCH.away.name);
  svg.appendChild(el('text',{x:W-pad,y:fy,'text-anchor':'end','font-size':10,
    'font-weight':500,fill:COL[leadKey==='draw'?'draw':(leadKey==='home'?'home':'away')],style:tnum},
    `${leadName} +${margin} pts`));

  return svg;
}

/* ============================================================================
   BUILD THE FEED
   ============================================================================ */
const feed=document.getElementById('feed');
const cards={}; // keep references for Live-mode re-render

function mount(idx,title,sub,vizFn,rawFn,extras){
  const c=card(idx,title,sub);
  const holder=document.createElement('div'); holder.dataset.viz=idx;
  holder.appendChild(vizFn());
  c.appendChild(holder);
  if(extras) c.appendChild(extras);
  c.appendChild(rawFn());
  feed.appendChild(c);
  cards[idx]={holder,vizFn};
  return holder;
}

/* legend helper */
function legend(items){
  const d=document.createElement('div'); d.className='legend';
  items.forEach(([col,txt])=>{ const k=document.createElement('span'); k.className='k';
    const dot=document.createElement('span'); dot.className='dot'; dot.style.background=col;
    k.appendChild(dot); k.appendChild(document.createTextNode(txt)); d.appendChild(k); });
  return d;
}

// 1 — Momentum (hero)
mount('1','Momentum — “lecho de río”',
  'La banda se inclina hacia quien presiona · la regla de abajo es el xG de cada remate · destello = gol.',
  ()=>vizMomentum(),
  ()=>rawTable(['Min','Equipo','xG','A puerta','Gol'],
    MATCH.shotsData.map(s=>[minLabel(s.min),s.team==='home'?'ARG':'EGY',es(s.xg.toFixed(2)),s.onTarget?'sí':'no',s.goal?'sí':'no'])));

// 2 — xG staircase
mount('2','xG acumulado — “escalera”',
  'Cada peldaño es un remate; su altura es el xG. Peligro sostenido frente a un chispazo.',
  ()=>vizStaircase(),
  ()=>rawTable(['Equipo','xG total'],[['Argentina',es(MATCH.xg[0].toFixed(2))],['Egipto',es(MATCH.xg[1].toFixed(2))]]),
  legend([['#4A82D6','Argentina'],['#D96B6B','Egipto']]));

// 3 — Possession as field control
mount('3','Posesión — “control del campo”',
  'El equipo con más balón ocupa más terreno y empuja la línea de control hacia el campo rival.',
  ()=>vizTug(),
  ()=>rawTable(['Equipo','Posesión'],[['Argentina',MATCH.possession[0]+'%'],['Egipto',MATCH.possession[1]+'%']]));

// 4 — Best chances ranked by xG
mount('4','Mejores ocasiones — “xG”',
  'Ranking de ocasiones por xG (mayor arriba). ● gol · barra llena = a puerta · contorno = fuera.',
  ()=>vizConstellation(),
  ()=>rawTable(['Min','Equipo','xG','A puerta','Gol'],
    MATCH.shotsData.map(s=>[minLabel(s.min),s.team==='home'?'ARG':'EGY',es(s.xg.toFixed(2)),s.onTarget?'sí':'no',s.goal?'sí':'no'])));

// 5 — Mirror bars (anchor)
mount('5','Cara a cara — “barras espejo”',
  'Cada métrica crece desde el centro hacia cada equipo. La asimetría cuenta la historia.',
  ()=>vizMirror(),
  ()=>rawTable(['Métrica','ARG','EGY'],[
    ['Posesión',MATCH.possession[0]+'%',MATCH.possession[1]+'%'],
    ['Tiros',MATCH.shots[0],MATCH.shots[1]],
    ['A puerta',MATCH.onTarget[0],MATCH.onTarget[1]],
    ['Toques área rival',MATCH.boxTouches[0],MATCH.boxTouches[1]],
    ['xG',es(MATCH.xg[0].toFixed(2)),es(MATCH.xg[1].toFixed(2))],
  ]));

// 6 — Starfield ratings + MOTM
mount('6','Valoraciones + MVP — “campo estelar”',
  'Cada jugador es una estrella; tamaño y brillo = su nota. Messi (8,7) es el MVP · también votable por la afición.',
  ()=>vizStarfield(),
  ()=>rawTable(['Jugador','Nota'],MATCH.lineup.slice().sort((a,b)=>b.rating-a.rating).map(p=>[p.name+(p.motm?' ★':''),es(p.rating.toFixed(1))])));

// 7 — Embers heat
mount('7','Toques en área rival — “brasas”',
  'La densidad de brasas es el número de toques: Argentina arde, Egipto apenas chispea.',
  ()=>vizEmbers(),
  ()=>rawTable(['Equipo','Toques en área rival'],[['Argentina',MATCH.boxTouches[0]],['Egipto',MATCH.boxTouches[1]]]));

// 8 — Breathing prediction
mount('8','Predicción — “bandas que respiran”',
  'El ancho es el % de votos; laten con el volumen social. En Live, los votos van entrando.',
  ()=>vizBreathing(),
  ()=>rawTable(['Resultado','Votos'],[
    ['Argentina gana',MATCH.prediction.home+'%'],
    ['Empate',MATCH.prediction.draw+'%'],
    ['Egipto gana',MATCH.prediction.away+'%'],
    ['Total votos',fmtInt(MATCH.prediction.totalVotes)],
  ]));

/* ============================================================================
   LIVE MODE — steps a clock through the timeline and re-renders the
   time-based visualizations: #1 momentum, #3 possession, #8 prediction.
   A gentle CSS "breathe" runs on #8 regardless of Live.
   ============================================================================ */
const liveToggle=document.getElementById('liveToggle');
let timer=null, liveMin=0, voteTick=0;

function reRender(idx, viz){ const h=cards[idx].holder; h.innerHTML=''; h.appendChild(viz); }

function liveStep(){
  liveMin += 1;
  if (liveMin>T_END){ liveMin=0; } // loop the match

  // #1 momentum — progressive left→right reveal
  reRender('1', vizMomentum(liveMin));

  // #3 possession — knot drifts with time
  reRender('3', vizTug(1 - possHomeAt(liveMin)/100));

  // #8 prediction — nudge percentages slightly + tick up the vote count
  voteTick++;
  const dh = Math.round(2*Math.sin(voteTick/9));
  const da = Math.round(1.5*Math.sin(voteTick/7+1));
  PRED.home = clamp(MATCH.prediction.home+dh,50,63);
  PRED.away = clamp(MATCH.prediction.away+da,20,30);
  PRED.draw = 100-PRED.home-PRED.away;
  PRED.totalVotes = MATCH.prediction.totalVotes + voteTick*137;
  reRender('8', vizBreathing());
}

liveToggle.addEventListener('change',()=>{
  if (liveToggle.checked){
    document.body.classList.add('is-live');
    liveMin=0; voteTick=0;
    timer=setInterval(liveStep, 120); // ~ steps a minute every 120ms
  } else {
    document.body.classList.remove('is-live');
    clearInterval(timer); timer=null;
    // reset to full static state
    liveMin=T_END; PRED={...MATCH.prediction};
    reRender('1', vizMomentum());
    reRender('3', vizTug());
    reRender('8', vizBreathing());
  }
});
</script>

<style>
/* breathing pulse for #8 (always on) — scale + opacity tied to social volume */
.breathe{ animation:breathe 3.4s ease-in-out infinite; }
@keyframes breathe{ 0%,100%{ transform:scale(1); opacity:.85; } 50%{ transform:scale(1.012); opacity:1; } }
#voteCount{ animation:breatheText 3.4s ease-in-out infinite; }
@keyframes breatheText{ 0%,100%{ opacity:.6; } 50%{ opacity:1; } }
</style>

<style>
/* ============================================================================
   VIZ ENHANCEMENTS — CSS aportado por los agentes de UI (animaciones/estados).
   ============================================================================ */
/* --- #1 vizMomentum --- */
@keyframes rmNow{0%,100%{opacity:1}50%{opacity:0.35}}
.viz .rm-now{animation:rmNow 1.8s ease-in-out infinite}

/* --- #3 vizTug --- */
.tug-num{ font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }

/* --- #6 vizStarfield --- */
/* #6 campo estelar — twinkle sutil de los halos (brillo vivo, sin glow/filtros) */
.rm-halo{ animation: rmTwinkle 3.4s ease-in-out infinite; }
.rm-halo.rm-mvp{ animation-duration: 2.8s; }
@keyframes rmTwinkle{ 0%,100%{ opacity:1; } 50%{ opacity:.68; } }
@media (prefers-reduced-motion: reduce){ .rm-halo{ animation:none; } }
</style>
</body>
</html>
