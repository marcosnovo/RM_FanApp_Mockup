<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Madrid · Match Center — Data Visualizations</title>

<!-- Clean geometric sans; falls back to the system stack if the font can't load.
     Two weights only (400 / 500) per the brand system. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================================
   BRAND SYSTEM  ·  Real Madrid Match Center — data-viz prototype
   Flat design: no gradients, no shadows, no glow. Hairline borders, whitespace.
   Every color also carries a size/position/label so color is never the only cue.
   ============================================================================ */
:root{
  /* --- club palette --- */
  --blue:      #0A2472;   /* primary club blue           */
  --gold:      #C8A24B;   /* gold accent                 */
  --gold-soft: #E0CFA0;   /* light gold / tan (away xG)  */

  /* home team = Argentina, standing in for "our team" (blue family) */
  --home:      #4A82D6;
  --home-soft: #7FA8E8;
  /* away team = Egypt (red family) */
  --away:      #D96B6B;
  --away-soft: #C94848;

  /* --- neutral surfaces (light) --- */
  --page:      #E6EAF3;
  --surface:   #EEF1F8;
  --surface-2: #FFFFFF;
  --border:    #D3D1C7;
  --ink:       #1A1A26;
  --muted:     #5A5A6E;

  --hair: 0.5px;                       /* hairline border weight */
  --radius: 14px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

/* --- dark mode: keep the club-blue identity, invert surfaces --- */
@media (prefers-color-scheme: dark){
  :root{
    --page:      #070B18;
    --surface:   #0E1327;
    --surface-2: #141A30;
    --border:    #2A3252;
    --ink:       #EAECF4;
    --muted:     #9AA0B8;
    --home-soft: #7FA8E8;
    --away-soft: #E08A8A;
  }
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--page);
  color:var(--ink);
  font-family:var(--font);
  font-weight:400;
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* Center the mobile column, cap width on desktop */
.wrap{
  max-width:480px;
  margin:0 auto;
  padding:0 0 48px;
  background:var(--page);
}

/* ---------------------------------------------------------------- header --- */
.appbar{
  position:sticky; top:0; z-index:50;
  background:var(--surface-2);
  border-bottom:var(--hair) solid var(--border);
  padding:10px 16px;
}
.appbar-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.score{
  font-weight:500; font-size:16px; letter-spacing:-0.01em;
  display:flex; align-items:center; gap:8px; white-space:nowrap;
}
.score .num{ color:var(--blue); }
@media (prefers-color-scheme: dark){ .score .num{ color:var(--home-soft); } }
.comp{ color:var(--muted); font-size:11px; margin-top:2px; }

/* Live toggle (tiny switch) */
.live{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); cursor:pointer; user-select:none; }
.live input{ position:absolute; opacity:0; width:0; height:0; }
.switch{
  width:34px; height:20px; border-radius:20px;
  background:var(--border); position:relative; transition:background .18s ease; flex:0 0 auto;
}
.switch::after{
  content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
  background:var(--surface-2); transition:transform .18s ease;
}
.live input:checked + .switch{ background:var(--home); }
.live input:checked + .switch::after{ transform:translateX(14px); }
.live-dot{ width:6px; height:6px; border-radius:50%; background:var(--away-soft); opacity:0; transition:opacity .2s; }
body.is-live .live-dot{ opacity:1; animation:blink 1.1s steps(2,start) infinite; }
@keyframes blink{ 50%{ opacity:.25; } }

/* ----------------------------------------------------------------- cards --- */
.intro{ padding:16px 16px 4px; color:var(--muted); font-size:12.5px; }
.card{
  background:var(--surface-2);
  border:var(--hair) solid var(--border);
  border-radius:var(--radius);
  margin:14px 16px;
  padding:16px 14px 12px;
}
.card h2{
  font-size:14px; font-weight:500; margin:0; letter-spacing:-0.01em;
  display:flex; align-items:baseline; gap:8px;
}
.card h2 .idx{ color:var(--gold); font-weight:500; font-size:12px; }
.card .sub{ color:var(--muted); font-size:11.5px; margin:4px 0 12px; }
.card svg.viz{ display:block; width:100%; height:auto; }

/* raw-data disclosure */
details.raw{ margin-top:10px; border-top:var(--hair) solid var(--border); padding-top:8px; }
details.raw summary{
  cursor:pointer; font-size:11px; color:var(--muted); list-style:none; display:flex; align-items:center; gap:6px;
}
details.raw summary::-webkit-details-marker{ display:none; }
details.raw summary::before{ content:"▸"; font-size:9px; transition:transform .15s; }
details.raw[open] summary::before{ transform:rotate(90deg); }
details.raw table{ width:100%; border-collapse:collapse; margin-top:8px; font-size:11px; }
details.raw th, details.raw td{ text-align:left; padding:3px 6px; border-bottom:var(--hair) solid var(--border); }
details.raw th{ color:var(--muted); font-weight:500; }
details.raw td.n{ text-align:right; font-variant-numeric:tabular-nums; }

.legend{ display:flex; flex-wrap:wrap; gap:10px 14px; font-size:10.5px; color:var(--muted); margin-top:8px; }
.legend .k{ display:inline-flex; align-items:center; gap:5px; }
.dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
.foot{ text-align:center; color:var(--muted); font-size:11px; padding:8px 16px 0; }

/* svg text defaults */
text{ font-family:var(--font); }
</style>
</head>
<body>
<div class="wrap">

  <!-- ═══════════════════════════ STICKY HEADER ═══════════════════════════ -->
  <header class="appbar">
    <div class="appbar-row">
      <div>
        <div class="score">
          🇦🇷 Argentina <span class="num">3</span> – <span class="num">2</span> Egipto 🇪🇬
        </div>
        <div class="comp">Copa del Mundo – Octavos de final</div>
      </div>
      <label class="live" title="Simula el partido en directo">
        <span class="live-dot"></span>
        <input type="checkbox" id="liveToggle">
        <span class="switch"></span>
        Live
      </label>
    </div>
  </header>

  <p class="intro">
    Prototipo de diseño · 8 formas nuevas de leer un partido. El significado <em>es</em> el dato:
    cada colina es un remate, cada destello un gol, cada inclinación el dominio real.
  </p>

  <!-- The 8 cards are generated by JS so the raw-data tables stay in sync with the data. -->
  <main id="feed"></main>

  <p class="foot">Prototipo — datos de muestra. Real Madrid · Match Center.</p>
</div>

<script>
/* ============================================================================
   SAMPLE DATA — match Argentina 3–2 Egypt. Exact values from the brief.
   (This is a design prototype: nothing here is wired to a live feed.)
   ============================================================================ */
const MATCH = {
  home: { name: "Argentina", short: "ARG", color: "#4A82D6" },
  away: { name: "Egipto",    short: "EGY", color: "#D96B6B" },
  score: [3, 2],
  competition: "Copa del Mundo – Octavos de final",
  possession: [64, 36],
  shots: [19, 5],
  onTarget: [7, 2],
  boxTouches: [34, 8],
  xg: [2.84, 0.89],
  prediction: { home: 57, draw: 18, away: 25, totalVotes: 710414 },
  goals: [
    { min: 15, team: "away", xg: 0.34, scorer: "Yasser Ibrahim" },
    { min: 67, team: "away", xg: 0.12, scorer: "Mostafa Ziko" },
    { min: 79, team: "home", xg: 0.28, scorer: "Cristian Romero" },
    { min: 83, team: "home", xg: 0.55, scorer: "Lionel Messi" },
    { min: 92, team: "home", xg: 0.41, scorer: "Enzo Fernández" }
  ],
  shotsData: [
    { min: 8,  team: "home", xg: 0.06, onTarget: false, goal: false },
    { min: 15, team: "away", xg: 0.34, onTarget: true,  goal: true  },
    { min: 21, team: "home", xg: 0.76, onTarget: true,  goal: false }, // Messi missed penalty
    { min: 33, team: "home", xg: 0.10, onTarget: false, goal: false },
    { min: 44, team: "home", xg: 0.14, onTarget: true,  goal: false },
    { min: 58, team: "home", xg: 0.09, onTarget: false, goal: false },
    { min: 67, team: "away", xg: 0.12, onTarget: true,  goal: true  },
    { min: 71, team: "home", xg: 0.22, onTarget: true,  goal: false },
    { min: 79, team: "home", xg: 0.28, onTarget: true,  goal: true  },
    { min: 83, team: "home", xg: 0.55, onTarget: true,  goal: true  },
    { min: 88, team: "away", xg: 0.18, onTarget: false, goal: false },
    { min: 92, team: "home", xg: 0.41, onTarget: true,  goal: true  }
  ],
  lineup: [
    { name: "Messi",      rating: 8.7, x: 0.82, y: 0.30, motm: true },
    { name: "Fernández",  rating: 8.2, x: 0.62, y: 0.42 },
    { name: "Paredes",    rating: 8.2, x: 0.30, y: 0.45 },
    { name: "Martínez",   rating: 7.6, x: 0.55, y: 0.22 },
    { name: "De Paul",    rating: 7.5, x: 0.42, y: 0.30 },
    { name: "Otamendi",   rating: 7.4, x: 0.40, y: 0.72 },
    { name: "Molina",     rating: 7.2, x: 0.78, y: 0.70 },
    { name: "Tagliafico", rating: 7.1, x: 0.20, y: 0.70 },
    { name: "Romero",     rating: 7.3, x: 0.58, y: 0.72 },
    { name: "Montiel",    rating: 7.0, x: 0.72, y: 0.55 },
    { name: "Martínez E", rating: 6.9, x: 0.50, y: 0.90 }
  ]
};

/* Full-match end minute (incl. stoppage). 90+2' goal lives at 92. */
const T_END = 95;

/* ============================================================================
   TINY HELPERS
   ============================================================================ */
const SVGNS = "http://www.w3.org/2000/svg";
/** create an SVG element with attributes */
function el(tag, attrs = {}, kids = []){
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  (Array.isArray(kids) ? kids : [kids]).forEach(c => c && n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
  return n;
}
/** deterministic PRNG (mulberry32) so stippling / scatter is stable across renders */
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
/** goal-minute label: 92 -> "90+2'" */
function minLabel(m){ return m>90 ? `90+${m-90}'` : `${m}'`; }
const fmtInt = n => n.toLocaleString('es-ES');
const es = n => String(n).replace('.', ','); // Spanish decimal comma

/** build a <details> raw-data block from rows [[label,value],...] or a full table */
function rawTable(cols, rows){
  const d = document.createElement('details'); d.className='raw';
  const s = document.createElement('summary'); s.textContent='Datos en crudo'; d.appendChild(s);
  const t = document.createElement('table');
  if (cols){
    const thead=document.createElement('thead'); const tr=document.createElement('tr');
    cols.forEach((c,i)=>{ const th=document.createElement('th'); th.textContent=c; if(i>0)th.style.textAlign='right'; tr.appendChild(th); });
    thead.appendChild(tr); t.appendChild(thead);
  }
  const tb=document.createElement('tbody');
  rows.forEach(r=>{ const tr=document.createElement('tr');
    r.forEach((cell,i)=>{ const td=document.createElement('td'); td.textContent=cell; if(i>0)td.className='n'; tr.appendChild(td); });
    tb.appendChild(tr);
  });
  t.appendChild(tb); d.appendChild(t); return d;
}

/** scaffold a card with title, subtitle, an SVG mount point, extras, and raw data */
function card(idx, title, subtitle){
  const c = document.createElement('section'); c.className='card';
  const h = document.createElement('h2');
  h.innerHTML = `<span class="idx">${idx}</span> ${title}`;
  const sub = document.createElement('div'); sub.className='sub'; sub.textContent = subtitle;
  c.appendChild(h); c.appendChild(sub);
  return c;
}
/* theme-aware ink for SVG text (resolved once at render) */
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

/* ============================================================================
   MOMENTUM MODEL — a per-minute momentum value in [-1,1].
   +1 = total home (ARG) dominance, -1 = total away (EGY) dominance.
   Control points are hand-authored to match the story of the events:
   ARG press early, EGY snatch a goal at 15', ARG win a pen (21') & surge late.
   The number IS the meaning: the frontier tilts by exactly this value.
   ============================================================================ */
const MOMENTUM = [
  [0,0.10],[6,0.35],[12,0.18],[15,-0.45],[18,-0.10],[21,0.55],[28,0.38],
  [38,0.30],[45,0.42],[52,0.28],[60,0.16],[67,-0.34],[70,0.18],[74,0.46],
  [79,0.62],[83,0.86],[88,0.58],[92,0.80],[95,0.90]
];
function momentumAt(m){
  if (m<=MOMENTUM[0][0]) return MOMENTUM[0][1];
  for (let i=1;i<MOMENTUM.length;i++){
    const [x1,y1]=MOMENTUM[i], [x0,y0]=MOMENTUM[i-1];
    if (m<=x1) return lerp(y0,y1,(m-x0)/(x1-x0));
  }
  return MOMENTUM[MOMENTUM.length-1][1];
}
/* Possession share (home %) over time — oscillates around the final 64%. */
function possHomeAt(m){ return clamp(58 + 6*Math.sin(m/13) + (m/95)*4, 30, 78); }

/* ============================================================================
   1 · MOMENTUM — "riverbed"  (HERO)
   A band over 90'. Central frontier tilts to the dominant team. Hills = shots
   (height ∝ xG). Goals = full-height flash + dashed line + label.
   `upto` clips the drawing for Live mode (progressive left→right reveal).
   ============================================================================ */
function vizMomentum(upto = T_END){
  const W=390, H=210, padL=12, padR=12, top=42, bot=176, mid=(top+bot)/2, amp=54;
  const x = m => padL + (m/T_END)*(W-padL-padR);
  const fy = m => mid + momentumAt(m)*amp;            // home + → frontier lower → more blue above

  const svg = el('svg',{class:'viz', viewBox:`0 0 ${W} ${H}`, role:'img',
    'aria-labelledby':'m1t m1d'});
  svg.appendChild(el('title',{id:'m1t'},'Momentum del partido tipo lecho de río'));
  svg.appendChild(el('desc',{id:'m1d'},'Banda de 90 minutos; la frontera central se inclina hacia el equipo que domina cada minuto, las colinas son remates y los destellos son goles.'));

  // sample the frontier every minute up to `upto`
  const step=1, pts=[];
  for (let m=0;m<=upto;m+=step) pts.push([x(m),fy(m)]);
  if (pts.length<2) pts.push([x(0),fy(0)]);
  const line = pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');

  // blue (home) fills from top down to the frontier; red (away) from frontier to bottom
  svg.appendChild(el('polygon',{points:`${padL},${top} ${line} ${pts[pts.length-1][0]},${top}`,
    fill:MATCH.home.color, 'fill-opacity':0.22}));
  svg.appendChild(el('polygon',{points:`${padL},${bot} ${line} ${pts[pts.length-1][0]},${bot}`,
    fill:MATCH.away.color, 'fill-opacity':0.22}));
  // the frontier itself
  svg.appendChild(el('polyline',{points:line, fill:'none', stroke:css('--muted'),
    'stroke-width':1, 'stroke-opacity':0.5}));
  // band frame
  svg.appendChild(el('rect',{x:padL,y:top,width:W-padL-padR,height:bot-top,fill:'none',
    stroke:css('--border'),'stroke-width':0.5}));

  // hills = shots (height ∝ xG). Home rise up (blue), away dip down (red).
  MATCH.shotsData.forEach(s=>{
    if (s.min>upto) return;
    const cx=x(s.min), base=fy(s.min), h=s.xg*90, w=7;
    const up = s.team==='home';
    const tipY = up ? base-h : base+h;
    const col = up ? MATCH.home.color : MATCH.away.color;
    svg.appendChild(el('path',{d:`M ${cx-w} ${base} Q ${cx} ${tipY} ${cx+w} ${base} Z`,
      fill:col, 'fill-opacity':s.goal?0.85:0.5, stroke:col, 'stroke-width':0.5}));
  });

  // goals = full-height flash + dashed vertical line + marker + label
  MATCH.goals.forEach((g,i)=>{
    if (g.min>upto) return;
    const cx=x(g.min), col = g.team==='home'?MATCH.home.color:MATCH.away.color;
    const short = g.team==='home'?MATCH.home.short:MATCH.away.short;
    svg.appendChild(el('line',{x1:cx,y1:top,x2:cx,y2:bot,stroke:col,'stroke-width':1,
      'stroke-dasharray':'2 3','stroke-opacity':0.7}));
    svg.appendChild(el('rect',{x:cx-1.5,y:top,width:3,height:bot-top,fill:col,'fill-opacity':0.18}));
    svg.appendChild(el('circle',{cx,cy:fy(g.min),r:3.2,fill:col,stroke:css('--surface-2'),'stroke-width':1}));
    // stagger labels across 3 rows above the band so clustered goals don't collide
    const ly = 10 + (i%3)*11;
    const anchor = cx>W-70 ? 'end' : (cx<44?'start':'middle');
    svg.appendChild(el('text',{x:cx, y:ly, 'text-anchor':anchor, 'font-size':8,
      fill:col, 'font-weight':500}, `${minLabel(g.min)} gol ${short}`));
  });

  // team name anchors: blue top-left, red bottom-right
  svg.appendChild(el('text',{x:padL+2,y:top+11,'font-size':9,'font-weight':500,fill:MATCH.home.color},'Argentina'));
  svg.appendChild(el('text',{x:W-padR-2,y:bot-5,'text-anchor':'end','font-size':9,'font-weight':500,fill:MATCH.away.color},'Egipto'));
  // minute ticks
  [0,15,30,45,60,75,90].forEach(m=>{
    svg.appendChild(el('text',{x:x(m),y:H-4,'text-anchor':'middle','font-size':7,fill:css('--muted')},`${m}'`));
  });
  return svg;
}

/* ============================================================================
   2 · xG ACUMULADO — "staircase"
   Each shot raises a step ∝ its xG. One line per team. Ends at the official
   totals (2.84 / 0.89) — the representative shot list is a subset, so a final
   riser closes the gap to the true total, direct-labelled at the right end.
   ============================================================================ */
function vizStaircase(){
  const W=390,H=180,padL=14,padR=44,top=18,bot=150;
  const xgMax=3.0;
  const x=m=>padL+(m/T_END)*(W-padL-padR);
  const y=v=>bot-(v/xgMax)*(bot-top);

  const svg=el('svg',{class:'viz',viewBox:`0 0 ${W} ${H}`,role:'img','aria-labelledby':'m2t m2d'});
  svg.appendChild(el('title',{id:'m2t'},'xG acumulado por equipo'));
  svg.appendChild(el('desc',{id:'m2d'},'Gráfico de escalones: cada remate sube un peldaño proporcional a su xG hasta los totales finales.'));

  // gridlines
  [0,1,2,3].forEach(v=>{
    svg.appendChild(el('line',{x1:padL,y1:y(v),x2:W-padR,y2:y(v),stroke:css('--border'),'stroke-width':0.5,'stroke-opacity':0.6}));
    svg.appendChild(el('text',{x:padL-2,y:y(v)+3,'text-anchor':'end','font-size':7,fill:css('--muted')},es(v.toFixed(1))));
  });

  function build(team, color, total, labelShort){
    const shots=MATCH.shotsData.filter(s=>s.team===team).sort((a,b)=>a.min-b.min);
    let cum=0, d=`M ${x(0)} ${y(0)}`;
    shots.forEach(s=>{ d+=` L ${x(s.min)} ${y(cum)}`; cum+=s.xg; d+=` L ${x(s.min)} ${y(cum)}`; });
    // Close the gap to the official total (remaining shots not in the sample) at the
    // LAST plotted minute so the path stays monotonic in x — a stoppage-time shot
    // (e.g. ARG at 92') must never make the staircase backtrack to an earlier minute.
    const lastMin = shots.length ? shots[shots.length-1].min : 0;
    if (total>cum) d+=` L ${x(lastMin)} ${y(total)}`;
    d+=` L ${x(T_END)} ${y(total)}`;
    svg.appendChild(el('path',{d,fill:'none',stroke:color,'stroke-width':2,'stroke-linejoin':'round'}));
    // shot dots
    let c2=0; shots.forEach(s=>{ c2+=s.xg; svg.appendChild(el('circle',{cx:x(s.min),cy:y(c2),r:s.goal?3:1.8,fill:color})); });
    // direct end label
    svg.appendChild(el('text',{x:W-padR+3,y:y(total)+3,'font-size':9,'font-weight':500,fill:color},
      `${labelShort} ${es(total.toFixed(2))}`));
  }
  build('home','#C8A24B',MATCH.xg[0],MATCH.home.short); // gold
  build('away','#B99A63',MATCH.xg[1],MATCH.away.short);            // tan / light gold

  [0,30,60,90].forEach(m=>svg.appendChild(el('text',{x:x(m),y:H-3,'text-anchor':'middle','font-size':7,fill:css('--muted')},`${m}'`)));
  return svg;
}

/* ============================================================================
   3 · POSESIÓN — "tug of war"
   One rope, one central knot. Knot fraction from the ARG (left) end = away% —
   so ARG's larger share pulls the knot toward ARG. `frac` overridable for Live.
   ============================================================================ */
function vizTug(frac){
  const W=390,H=88,padL=42,padR=42,y=44,L=padL,R=W-padR,len=R-L;
  const awayShare = frac!=null ? frac : MATCH.possession[1]/100; // knot pos from left
  const homePct = frac!=null ? Math.round((1-frac)*100) : MATCH.possession[0];
  const awayPct = 100-homePct;
  const kx = L + len*awayShare;

  const svg=el('svg',{class:'viz',viewBox:`0 0 ${W} ${H}`,role:'img','aria-labelledby':'m3t m3d'});
  svg.appendChild(el('title',{id:'m3t'},'Posesión tipo tira y afloja'));
  svg.appendChild(el('desc',{id:'m3d'},'Una cuerda con un nudo central; la posición del nudo codifica el reparto de posesión.'));

  // rope halves colored by team
  svg.appendChild(el('line',{x1:L,y1:y,x2:kx,y2:y,stroke:MATCH.home.color,'stroke-width':4,'stroke-linecap':'round'}));
  svg.appendChild(el('line',{x1:kx,y1:y,x2:R,y2:y,stroke:MATCH.away.color,'stroke-width':4,'stroke-linecap':'round'}));
  // ticks
  for(let i=1;i<10;i++){ const tx=L+len*i/10; svg.appendChild(el('line',{x1:tx,y1:y-4,x2:tx,y2:y+4,stroke:css('--border'),'stroke-width':0.5})); }
  // knot
  svg.appendChild(el('circle',{class:'knot',cx:kx,cy:y,r:7,fill:css('--surface-2'),stroke:css('--ink'),'stroke-width':1.5}));
  svg.appendChild(el('circle',{cx:kx,cy:y,r:2.5,fill:css('--ink')}));
  // end labels
  svg.appendChild(el('text',{x:L-4,y:y+4,'text-anchor':'end','font-size':13,'font-weight':500,fill:MATCH.home.color,class:'pctH'},`${homePct}%`));
  svg.appendChild(el('text',{x:R+4,y:y+4,'font-size':13,'font-weight':500,fill:MATCH.away.color,class:'pctA'},`${awayPct}%`));
  svg.appendChild(el('text',{x:L,y:20,'font-size':9,fill:MATCH.home.color,'font-weight':500},'Argentina'));
  svg.appendChild(el('text',{x:R,y:20,'text-anchor':'end','font-size':9,fill:MATCH.away.color,'font-weight':500},'Egipto'));
  return svg;
}

/* ============================================================================
   4 · MAPA DE TIROS — "constellation"
   Half-pitch dark field. Each shot = a star; size ∝ xG, opacity ∝ on-target,
   goal = filled bright star + ring. Two colors for two teams.
   NOTE: shotsData carries no pitch coords, so positions are synthesized
   deterministically — higher xG sits nearer the goal (assumption, see report).
   ============================================================================ */
function vizConstellation(){
  const W=390,H=250,cx=W/2,goalY=26;
  const field='#0B1024';
  const svg=el('svg',{class:'viz',viewBox:`0 0 ${W} ${H}`,role:'img','aria-labelledby':'m4t m4d'});
  svg.appendChild(el('title',{id:'m4t'},'Mapa de tiros tipo constelación'));
  svg.appendChild(el('desc',{id:'m4d'},'Tercio de ataque como campo oscuro; cada estrella es un remate, el tamaño es su xG y las estrellas llenas son goles.'));

  svg.appendChild(el('rect',{x:0,y:0,width:W,height:H,rx:10,fill:field}));
  // pitch markings (goal line, box, penalty arc)
  const mk={stroke:'#3A4570','stroke-width':1,fill:'none'};
  svg.appendChild(el('line',{x1:0,y1:goalY,x2:W,y2:goalY,...mk}));
  svg.appendChild(el('rect',{x:cx-70,y:goalY,width:140,height:70,...mk}));
  svg.appendChild(el('rect',{x:cx-30,y:goalY,width:60,height:26,...mk}));
  svg.appendChild(el('path',{d:`M ${cx-40} ${goalY+70} A 55 55 0 0 0 ${cx+40} ${goalY+70}`,...mk}));
  svg.appendChild(el('line',{x1:cx-8,y1:goalY,x2:cx+8,y2:goalY,stroke:'#8894C0','stroke-width':2})); // goal

  const r=rng(7);
  MATCH.shotsData.forEach(s=>{
    // higher xG → closer to goal & more central
    const dist = lerp(190,44, clamp(s.xg,0,0.8)/0.8);
    const ang  = (r()-0.5)*1.5;              // spread across the arc
    const px = clamp(cx + Math.sin(ang)*dist, 20, W-20);
    const py = clamp(goalY + Math.cos(ang)*dist*0.85 + 6, goalY+6, H-24);
    const col = s.team==='home'?'#7FA8E8':'#E08A8A';
    const size = 2.5 + s.xg*9;
    const op = s.onTarget?1:0.5;
    if (s.goal){
      svg.appendChild(el('circle',{cx:px,cy:py,r:size+5,fill:'none',stroke:col,'stroke-width':1,'stroke-opacity':0.6}));
      svg.appendChild(star(px,py,size+1,col,1));
    } else {
      svg.appendChild(el('circle',{cx:px,cy:py,r:size,fill:col,'fill-opacity':op,stroke:col,'stroke-width':0.5}));
    }
  });

  // legend (in-field)
  svg.appendChild(el('text',{x:12,y:H-10,'font-size':8,fill:'#8894C0'},'tamaño = xG · estrella llena = gol · brillo = a puerta'));
  return svg;
  function star(cx,cy,rad,fill,op){
    let d=''; for(let i=0;i<10;i++){ const rr=i%2?rad*0.45:rad; const a=Math.PI/5*i-Math.PI/2; d+=(i?'L':'M')+(cx+Math.cos(a)*rr).toFixed(1)+' '+(cy+Math.sin(a)*rr).toFixed(1)+' '; }
    return el('path',{d:d+'Z',fill,'fill-opacity':op});
  }
}

/* ============================================================================
   5 · CARA A CARA — "mirror bars"  (ANCHOR)
   Central axis; each metric grows from the center to each side. Bars scaled by
   the row max so the asymmetry alone tells the story; numbers direct-labelled.
   xG row highlighted in gold.
   ============================================================================ */
function vizMirror(){
  const rows=[
    {label:'Posesión',   h:MATCH.possession[0], a:MATCH.possession[1], suf:'%'},
    {label:'Tiros',      h:MATCH.shots[0],      a:MATCH.shots[1]},
    {label:'A puerta',   h:MATCH.onTarget[0],   a:MATCH.onTarget[1]},
    {label:'Toques área',h:MATCH.boxTouches[0], a:MATCH.boxTouches[1]},
    {label:'xG',         h:MATCH.xg[0],         a:MATCH.xg[1], gold:true, dec:true},
  ];
  const W=390,rowH=30,padT=6,H=padT+rows.length*rowH+6,cx=W/2,maxBar=(W/2)-58,gap=2;
  const svg=el('svg',{class:'viz',viewBox:`0 0 ${W} ${H}`,role:'img','aria-labelledby':'m5t m5d'});
  svg.appendChild(el('title',{id:'m5t'},'Estadísticas cara a cara en barras espejo'));
  svg.appendChild(el('desc',{id:'m5d'},'Eje central; cada métrica crece hacia el lado de cada equipo, con los números etiquetados en cada extremo.'));

  rows.forEach((row,i)=>{
    const yc=padT+i*rowH+rowH/2;
    const max=Math.max(row.h,row.a);
    const hw=(row.h/max)*maxBar, aw=(row.a/max)*maxBar;
    const hCol=row.gold?'#C8A24B':MATCH.home.color;
    const aCol=row.gold?'#B99A63':MATCH.away.color;
    // bars
    svg.appendChild(el('rect',{x:cx-gap-hw,y:yc-8,width:hw,height:16,rx:3,fill:hCol,'fill-opacity':row.gold?0.95:0.85}));
    svg.appendChild(el('rect',{x:cx+gap,y:yc-8,width:aw,height:16,rx:3,fill:aCol,'fill-opacity':row.gold?0.95:0.85}));
    // metric label centered above axis
    svg.appendChild(el('text',{x:cx,y:yc-11,'text-anchor':'middle','font-size':8,fill:row.gold?'#C8A24B':css('--muted'),'font-weight':500},row.label));
    // value labels at bar ends
    const hv=row.dec?es(row.h.toFixed(2)):row.h+(row.suf||'');
    const av=row.dec?es(row.a.toFixed(2)):row.a+(row.suf||'');
    svg.appendChild(el('text',{x:cx-gap-hw-4,y:yc+3.5,'text-anchor':'end','font-size':10,'font-weight':500,fill:hCol},hv));
    svg.appendChild(el('text',{x:cx+gap+aw+4,y:yc+3.5,'font-size':10,'font-weight':500,fill:aCol},av));
  });
  // central axis
  svg.appendChild(el('line',{x1:cx,y1:padT,x2:cx,y2:H-4,stroke:css('--border'),'stroke-width':0.5}));
  return svg;
}

/* ============================================================================
   6 · VALORACIONES + MOTM — "starfield"
   Club-blue pitch (halfway line + centre circle). Starting XI at formation
   coords; star size/brightness ∝ rating. MOTM = biggest, brightest star + ring + ★.
   Coord assumption: x=0..1 left→right, y=0 attack (top) → 1 own goal (bottom).
   Tap a star → console.log (stub for "open player detail").
   ============================================================================ */
function vizStarfield(){
  const W=390,H=250,pad=10,field='#0A2472';
  const px=v=>pad+v*(W-2*pad);
  const py=v=>pad+v*(H-2*pad);
  const svg=el('svg',{class:'viz',viewBox:`0 0 ${W} ${H}`,role:'img','aria-labelledby':'m6t m6d'});
  svg.appendChild(el('title',{id:'m6t'},'Valoraciones de jugadores tipo campo estelar'));
  svg.appendChild(el('desc',{id:'m6d'},'Campo azul con el once inicial; cada jugador es una estrella cuyo tamaño y brillo son su nota. El MVP es la estrella mayor con anillo.'));

  svg.appendChild(el('rect',{x:0,y:0,width:W,height:H,rx:10,fill:field}));
  svg.appendChild(el('line',{x1:pad,y1:H/2,x2:W-pad,y2:H/2,stroke:'#2A3F82','stroke-width':1}));
  svg.appendChild(el('circle',{cx:W/2,cy:H/2,r:34,fill:'none',stroke:'#2A3F82','stroke-width':1}));

  MATCH.lineup.forEach(p=>{
    const x=px(p.x), y=py(p.y);
    const t=clamp((p.rating-6.5)/2.4,0,1);       // 6.5→8.9 mapped to 0..1
    const size=5+t*7, op=0.55+t*0.45;
    const col=p.motm?'#C8A24B':'#DCE4F7';
    const g=el('g',{style:'cursor:pointer'});
    g.addEventListener('click',()=>console.log('open player detail:',p.name,p.rating));
    if(p.motm) g.appendChild(el('circle',{cx:x,cy:y,r:size+6,fill:'none',stroke:'#C8A24B','stroke-width':1.2,'stroke-opacity':0.8}));
    g.appendChild(star(x,y,size,col,op));
    // label: surname + rating
    g.appendChild(el('text',{x,y:y+size+9,'text-anchor':'middle','font-size':7.5,fill:'#DCE4F7'},
      `${p.motm?'★ ':''}${p.name} ${es(p.rating.toFixed(1))}`));
    svg.appendChild(g);
  });
  return svg;
  function star(cx,cy,rad,fill,op){
    let d=''; for(let i=0;i<10;i++){ const rr=i%2?rad*0.45:rad; const a=Math.PI/5*i-Math.PI/2; d+=(i?'L':'M')+(cx+Math.cos(a)*rr).toFixed(1)+' '+(cy+Math.sin(a)*rr).toFixed(1)+' '; }
    return el('path',{d:d+'Z',fill,'fill-opacity':op});
  }
}

/* ============================================================================
   7 · TOQUES EN ÁREA RIVAL — "embers / heat"
   Two penalty boxes side by side. Touch count = density of stippled warm dots
   (+ soft warm blobs for the hot one). ARG 34 = glowing, EGY 8 = sparse.
   Not a raster blur — real dots, one cluster per count band.
   ============================================================================ */
function vizEmbers(){
  const W=390,H=180;
  const svg=el('svg',{class:'viz',viewBox:`0 0 ${W} ${H}`,role:'img','aria-labelledby':'m7t m7d'});
  svg.appendChild(el('title',{id:'m7t'},'Toques en el área rival tipo brasas'));
  svg.appendChild(el('desc',{id:'m7d'},'Dos áreas de penalti; la densidad de puntos cálidos codifica los toques: Argentina caliente, Egipto disperso.'));

  drawBox(20,'Argentina',MATCH.boxTouches[0],11);
  drawBox(210,'Egipto',MATCH.boxTouches[1],22);
  return svg;

  function drawBox(ox,label,count,seed){
    const bw=160,bh=110,oy=26;
    const g=el('g');
    // glow underlay ∝ count (layered translucent warm shapes — not a blur filter)
    const heat=clamp(count/34,0,1);
    for(let i=0;i<3;i++){
      g.appendChild(el('ellipse',{cx:ox+bw/2,cy:oy+bh*0.62,rx:bw*0.4*(1-i*0.18),ry:bh*0.38*(1-i*0.18),
        fill:'#E8663C','fill-opacity':(0.05+0.09*heat)}));
    }
    // penalty box outline
    const mk={fill:'none',stroke:css('--border'),'stroke-width':1};
    g.appendChild(el('line',{x1:ox,y1:oy,x2:ox+bw,y2:oy,...mk}));                 // goal line
    g.appendChild(el('rect',{x:ox+8,y:oy,width:bw-16,height:bh,...mk}));
    g.appendChild(el('rect',{x:ox+bw/2-22,y:oy,width:44,height:22,...mk}));
    // stippled touches — density IS the count
    const r=rng(seed);
    for(let i=0;i<count;i++){
      const rx=ox+16+r()*(bw-32);
      const ry=oy+10+r()*(bh-20);
      const t=r();
      const col = t>0.55?'#E8663C':(t>0.25?'#E89A3C':'#D9C24B');
      g.appendChild(el('circle',{cx:rx,cy:ry,r:2.4,fill:col,'fill-opacity':0.85}));
    }
    g.appendChild(el('text',{x:ox+bw/2,y:16,'text-anchor':'middle','font-size':10,'font-weight':500,fill:css('--ink')},label));
    g.appendChild(el('text',{x:ox+bw/2,y:oy+bh+16,'text-anchor':'middle','font-size':11,'font-weight':500,fill:'#D2622F'},`${count} toques`));
    svg.appendChild(g);
  }
}

/* ============================================================================
   8 · PREDICCIÓN / ENCUESTA — "breathing bands"
   Three bands (ARG 57 / Empate 18 / EGY 25). Widths ∝ %. Bands "breathe"
   (CSS pulse) to convey live social volume. Live mode nudges the % + vote count.
   ============================================================================ */
let PRED = {...MATCH.prediction};
function vizBreathing(){
  const W=390,H=150,pad=14,barW=W-2*pad,y0=16,bh=30,gap=8;
  const bands=[
    {k:'home', label:`${MATCH.home.name} gana`, col:MATCH.home.color},
    {k:'draw', label:'Empate', col:'#B99A63'},
    {k:'away', label:`${MATCH.away.name} gana`, col:MATCH.away.color},
  ];
  const svg=el('svg',{class:'viz',viewBox:`0 0 ${W} ${H}`,role:'img','aria-labelledby':'m8t m8d',id:'breathSvg'});
  svg.appendChild(el('title',{id:'m8t'},'Predicción de la afición en bandas que respiran'));
  svg.appendChild(el('desc',{id:'m8d'},'Tres bandas cuyo ancho es el porcentaje de votos; laten suavemente para transmitir el volumen social en directo.'));

  bands.forEach((b,i)=>{
    const y=y0+i*(bh+gap);
    const w=(PRED[b.k]/100)*barW;
    const rect=el('rect',{x:pad,y,width:w,height:bh,rx:5,fill:b.col,'fill-opacity':0.85,
      class:'breathe', 'data-k':b.k, style:`animation-delay:${i*0.4}s;transform-origin:${pad}px ${y+bh/2}px`});
    svg.appendChild(el('rect',{x:pad,y,width:barW,height:bh,rx:5,fill:'none',stroke:css('--border'),'stroke-width':0.5}));
    svg.appendChild(rect);
    svg.appendChild(el('text',{x:pad+6,y:y+bh/2+3.5,'font-size':10,'font-weight':500,fill:'#fff'},b.label));
    svg.appendChild(el('text',{x:pad+barW,y:y+bh/2+3.5,'text-anchor':'end','font-size':11,'font-weight':500,fill:b.col,class:'pctLbl','data-k':b.k},`${PRED[b.k]}%`));
  });
  // pulsing total-votes number
  svg.appendChild(el('text',{x:W/2,y:H-8,'text-anchor':'middle','font-size':11,fill:css('--muted'),id:'voteCount',class:'breathe'},
    `${fmtInt(PRED.totalVotes)} votos`));
  return svg;
}

/* ============================================================================
   BUILD THE FEED
   ============================================================================ */
const feed=document.getElementById('feed');
const cards={}; // keep references for Live-mode re-render

function mount(idx,title,sub,vizFn,rawFn,extras){
  const c=card(idx,title,sub);
  const holder=document.createElement('div'); holder.dataset.viz=idx;
  holder.appendChild(vizFn());
  c.appendChild(holder);
  if(extras) c.appendChild(extras);
  c.appendChild(rawFn());
  feed.appendChild(c);
  cards[idx]={holder,vizFn};
  return holder;
}

/* legend helper */
function legend(items){
  const d=document.createElement('div'); d.className='legend';
  items.forEach(([col,txt])=>{ const k=document.createElement('span'); k.className='k';
    const dot=document.createElement('span'); dot.className='dot'; dot.style.background=col;
    k.appendChild(dot); k.appendChild(document.createTextNode(txt)); d.appendChild(k); });
  return d;
}

/* ============================================================================
   LIVE MODE — steps a clock through the timeline and re-renders the
   time-based visualizations: #1 momentum, #3 possession, #8 prediction.
   A gentle CSS "breathe" runs on #8 regardless of Live.
   ============================================================================ */
const liveToggle=document.getElementById('liveToggle');
let timer=null, liveMin=0, voteTick=0;

function reRender(idx, viz){ const h=cards[idx].holder; h.innerHTML=''; h.appendChild(viz); }

function liveStep(){
  liveMin += 1;
  if (liveMin>T_END){ liveMin=0; } // loop the match

  // #1 momentum — progressive left→right reveal
  reRender('1', vizMomentum(liveMin));

  // #3 possession — knot drifts with time
  reRender('3', vizTug(1 - possHomeAt(liveMin)/100));

  // #8 prediction — nudge percentages slightly + tick up the vote count
  voteTick++;
  const dh = Math.round(2*Math.sin(voteTick/9));
  const da = Math.round(1.5*Math.sin(voteTick/7+1));
  PRED.home = clamp(MATCH.prediction.home+dh,50,63);
  PRED.away = clamp(MATCH.prediction.away+da,20,30);
  PRED.draw = 100-PRED.home-PRED.away;
  PRED.totalVotes = MATCH.prediction.totalVotes + voteTick*137;
  reRender('8', vizBreathing());
}

liveToggle.addEventListener('change',()=>{
  if (liveToggle.checked){
    document.body.classList.add('is-live');
    liveMin=0; voteTick=0;
    timer=setInterval(liveStep, 120); // ~ steps a minute every 120ms
  } else {
    document.body.classList.remove('is-live');
    clearInterval(timer); timer=null;
    // reset to full static state
    liveMin=T_END; PRED={...MATCH.prediction};
    reRender('1', vizMomentum());
    reRender('3', vizTug());
    reRender('8', vizBreathing());
  }
});
